<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FAQ — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="help"></div>
    <div><h1>Maswali ya Kawaida</h1><p>Majibu ya haraka kuhusu malipo, oda, rental na zaidi.</p></div>
    <div class="zp-ph-side opt"><a class="zp-btn ghost" href="contact.html"><span data-ic="headset"></span>Wasiliana Nasi</a></div>
  </header>

  <div class="fq-list" id="fqList"></div>

  <section class="zp-ai" style="margin-top:26px;max-width:760px">
    <div>
      <h2 style="font-size:24px">Swali lako halipo hapa?</h2>
      <p style="margin:0">Uliza AI Assistant au tuandikie WhatsApp moja kwa moja.</p>
    </div>
    <a class="zp-btn" href="ai.html"><span data-ic="bot"></span>Uliza AI</a>
  </section>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  var esc=ZP.esc;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });
  var FAQ=[
    ['wallet','Malipo yanafanya kazi vipi?','Unachagua bidhaa, unaenda checkout, unalipa kwa M-Pesa, Tigo Pesa, Airtel Money au HaloPesa kupitia ukurasa salama wa AzamPay. Malipo yanathibitika automatic.'],
    ['box','Nitapata bidhaa yangu lini?','Mara moja baada ya malipo kuthibitika — angalia "My Orders" kupata key, account au download link yako.'],
    ['alert','Vipi kama sikupata bidhaa baada ya kulipa?','Subiri dakika chache kisha angalia "My Orders". Kama bado hujapata, wasiliana WhatsApp na tx reference yako.'],
    ['cloud','Rental ya GeForce NOW inafanya kazi vipi?','Unanunua muda (dakika au masaa), timer inaanza automatic baada ya malipo. Fungua GeForce NOW na Steam account yako mwenyewe kucheza.'],
    ['search','Naweza kuomba game isiyopo dukani?','Ndiyo — nenda "Game Requests", ingia, andika jina la game na upige kura. Tukiona mahitaji makubwa tunaiongeza haraka.'],
    ['gift','Naweza kupata discount?','Tunatoa discount codes mara kwa mara kwenye Checkout — fuatilia matangazo yetu au uliza AI Assistant.'],
    ['bot','AI Assistant anaweza kunisaidia nini?','Bonyeza kitufe cha AI kona ya chini, au fungua ukurasa wa AI Assistant — anaweza kukusaidia na bei, bidhaa, malipo na maswali mengine wakati wowote.']
  ];
  document.getElementById('fqList').innerHTML=FAQ.map(function(f,i){
    return '<details class="fq-item"'+(i===0?' open':'')+'><summary><span class="q-ic">'+ZP.icon(f[0])+'</span><span>'+esc(f[1])+'</span><span class="chev">'+ZP.icon('chevr').replace('<svg','<svg style="transform:rotate(90deg)"')+'</span></summary><p class="a">'+esc(f[2])+'</p></details>';
  }).join('');
})();
</script>
</body>
</html>
