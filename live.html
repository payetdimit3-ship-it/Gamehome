<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Live TV / Sports — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="tv"></div>
    <div><h1>Live TV / Sports</h1><p>Tazama mechi na matangazo ya live yaliyochapishwa na LIFEISGAMETZ.</p></div>
    <div class="zp-ph-side opt"><a class="zp-btn ghost" href="livescores.html"><span data-ic="trophy"></span>Live Scores</a></div>
  </header>

  <div class="lv-layout">
    <div>
      <div class="lv-stage" id="stage"><div class="lv-none"><h3>Inapakia...</h3></div></div>
      <div class="lv-info" id="info" hidden></div>
    </div>
    <aside class="lv-side" id="side">
      <header>Mechi za Sasa <small id="sideCount"></small></header>
      <div class="lv-list" id="sideList"></div>
    </aside>
  </div>

  <div class="zp-sec"><h2>Mechi &amp; Streams</h2></div>
  <nav class="zp-tabs" id="tabs" aria-label="Hali ya mechi"></nav>
  <section class="lv-grid" id="grid" aria-live="polite"></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  var esc=ZP.esc, M=ZP.match;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });

  var TABS=[['all','Zote'],['live','Live'],['upcoming','Ratiba'],['ended','Zimekwisha']];
  var tab='all', streams=[], selectedId=new URLSearchParams(location.search).get('id')||'', lastJson='', hls=null, stageKey='';

  function safeUrl(u){ return /^https?:\/\//i.test(String(u||'').trim()) ? String(u).trim() : ''; }
  function ytEmbed(url){
    try{
      var u=new URL(url), id='';
      if (u.hostname.indexOf('youtu.be')>-1) id=u.pathname.slice(1);
      else if (u.searchParams.get('v')) id=u.searchParams.get('v');
      else { var m=u.pathname.match(/\/(?:live|shorts|embed)\/([^/?]+)/); if(m) id=m[1]; }
      return id ? 'https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&rel=0&modestbranding=1&playsinline=1' : '';
    }catch(e){ return ''; }
  }
  function mediaOf(x){
    var url=safeUrl(x.videoUrl)||safeUrl(x.streamUrl);
    if (!url) return {kind:'none'};
    var yt=ytEmbed(url);
    if (yt) return {kind:'iframe',url:yt};
    if (/youtube\.com|youtu\.be/i.test(url)) return {kind:'iframe',url:url};
    if (/\.m3u8(?:$|\?)/i.test(url)) return {kind:'hls',url:url};
    if (/\.(mp4|webm|mov|m4v)(?:$|\?)/i.test(url)) return {kind:'video',url:url};
    return {kind:'iframe',url:url,generic:true};
  }

  function current(){
    var x=streams.filter(function(s){ return s.id===selectedId; })[0];
    if (x) return x;
    var live=streams.filter(function(s){ return M.status(s)==='live'; })[0];
    return live || streams[0] || null;
  }

  function insertMedia(stage,m,x){
    if (hls){ try{ hls.destroy(); }catch(e){} hls=null; }
    if (m.kind==='iframe'){
      stage.innerHTML='<iframe src="'+esc(m.url)+'" title="'+esc(x.title)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    } else if (m.kind==='video'){
      stage.innerHTML='<video controls playsinline autoplay muted src="'+esc(m.url)+'"></video>';
    } else {
      stage.innerHTML='<video controls playsinline autoplay muted></video>';
      var v=stage.querySelector('video');
      if (window.Hls && Hls.isSupported()){ hls=new Hls(); hls.loadSource(m.url); hls.attachMedia(v); } else v.src=m.url;
    }
  }
  function renderStage(x){
    var stage=document.getElementById('stage');
    if (!x){
      if (hls){ try{ hls.destroy(); }catch(e){} hls=null; }
      stage.innerHTML='<div class="lv-none">'+ZP.icon('tv')+'<h3>Hakuna match live kwa sasa</h3><p>Rudi baadaye au angalia matokeo kwenye Live Scores.</p><a class="zp-btn sm" href="livescores.html">Live Scores</a></div>';
      return;
    }
    var m=mediaOf(x);
    if (m.kind==='none'){
      if (hls){ try{ hls.destroy(); }catch(e){} hls=null; }
      stage.innerHTML='<div class="lv-none">'+ZP.icon('tv')+'<h3>Stream haijawekwa</h3><p>Mechi hii bado haina video. Angalia matokeo kwenye Live Scores.</p></div>';
      return;
    }
    if (ZP.dataSaver()){
      if (hls){ try{ hls.destroy(); }catch(e){} hls=null; }
      stage.innerHTML='<button type="button" class="zp-ds-play" style="position:relative;width:100%;height:100%;aspect-ratio:16/9">'+ZP.icon('play')+'<span>Data Saver iko wazi — bonyeza kucheza stream</span></button>';
      stage.querySelector('.zp-ds-play').addEventListener('click',function(){ insertMedia(stage,m,x); });
      return;
    }
    insertMedia(stage,m,x);
  }

  function renderInfo(x){
    var box=document.getElementById('info');
    if (!x){ box.hidden=true; return; }
    box.hidden=false;
    var st=M.status(x), t=M.teams(x);
    var pill = st==='live' ? '<span class="ls-pill live"><i class="ls-dot"></i>LIVE'+(x.minute?' '+esc(x.minute)+'\'':'')+'</span>'
             : st==='ended' ? '<span class="ls-pill">IMEKWISHA</span>' : '<span class="ls-pill">RATIBA'+(x.startTime?' • '+esc(x.startTime):'')+'</span>';
    var vs='';
    if (t[1]){
      vs='<div class="lv-vs">'+M.badge(t[0])+'<span>'+esc(t[0])+'</span>'+
        (M.hasScore(x)&&st!=='upcoming'?'<div class="ls-score"><span>'+esc(x.homeScore)+'</span><em>–</em><span>'+esc(x.awayScore)+'</span></div>':'<span class="ls-score pending" style="padding:0 14px">vs</span>')+
        '<span>'+esc(t[1])+'</span>'+M.badge(t[1])+'</div>';
    }
    var generic=mediaOf(x).generic;
    box.innerHTML='<div class="lv-meta">'+pill+'<span>'+esc(x.league||'Football')+'</span></div><h2>'+esc(x.title)+'</h2>'+vs+
      (x.description?'<p>'+esc(x.description)+'</p>':'')+
      (generic?'<p class="lv-note">Ikiwa link ni website ya kawaida, inaweza kukataa kuonyeshwa hapa. Tumia YouTube Embed au Direct MP4/WebM/HLS.</p>':'');
  }

  function scoreText(x){ return M.hasScore(x) && M.status(x)!=='upcoming' ? x.homeScore+' – '+x.awayScore : ''; }

  function renderSide(cur){
    var order={live:0,upcoming:1,ended:2};
    var list=streams.slice().sort(function(a,b){ return order[M.status(a)]-order[M.status(b)]; }).slice(0,12);
    document.getElementById('sideCount').textContent=streams.length? streams.length+' mechi' : '';
    document.getElementById('sideList').innerHTML=list.length ? list.map(function(x){
      var st=M.status(x), t=M.teams(x);
      return '<button type="button" class="lv-mini'+(cur&&x.id===cur.id?' on':'')+'" data-id="'+esc(x.id)+'"><i class="lv-st '+st+'"></i><span><b>'+esc(t[1]?t[0]+' vs '+t[1]:x.title)+'</b><small>'+esc(x.league||'Football')+(st==='upcoming'&&x.startTime?' • '+esc(x.startTime):'')+'</small></span><span class="lv-sc">'+esc(scoreText(x))+'</span></button>';
    }).join('') : '<div class="zp-empty" style="border:0"><p>Hakuna mechi bado.</p></div>';
  }

  function renderGrid(cur){
    var counts={all:streams.length,live:0,upcoming:0,ended:0};
    streams.forEach(function(s){ counts[M.status(s)]++; });
    document.getElementById('tabs').innerHTML=TABS.map(function(t){ return '<button type="button" class="zp-chip'+(t[0]===tab?' active':'')+'" data-t="'+t[0]+'">'+t[1]+' <i>'+counts[t[0]]+'</i></button>'; }).join('');
    var list=streams.filter(function(s){ return tab==='all'||M.status(s)===tab; });
    var grid=document.getElementById('grid');
    if (!list.length){ grid.innerHTML='<div class="zp-empty"><h3>'+(streams.length?'Hakuna mechi kwenye kundi hili':'Hakuna mechi bado')+'</h3><p>Mechi zikiwekwa na admin zitaonekana hapa.</p></div>'; return; }
    grid.innerHTML=list.map(function(x){
      var st=M.status(x), t=M.teams(x);
      var badge = st==='live' ? '<span class="lv-badge live"><i class="ls-dot" style="background:#fff;animation:none"></i>LIVE</span>' : '<span class="lv-badge">'+(st==='ended'?'IMEKWISHA':'RATIBA')+'</span>';
      var faces = t[1] ? M.badge(t[0])+'<span class="vs">'+(scoreText(x)||'VS')+'</span>'+M.badge(t[1]) : M.badge(t[0]);
      return '<button type="button" class="lv-card'+(cur&&x.id===cur.id?' on':'')+'" data-id="'+esc(x.id)+'"><div class="lv-thumb" style="--art:'+ZP.art(x.title)+'">'+badge+faces+'<span class="lv-play">'+ZP.icon('play')+'</span></div>'+
        '<div class="lv-body"><h3>'+esc(x.title)+'</h3><small>'+esc(x.league||'Football')+(x.startTime&&st==='upcoming'?' • '+esc(x.startTime):'')+'</small></div></button>';
    }).join('');
  }

  function render(forceStage){
    var cur=current();
    var key=cur? cur.id+'|'+(cur.videoUrl||'')+'|'+(cur.streamUrl||'') : 'none';
    if (forceStage || key!==stageKey){ stageKey=key; renderStage(cur); }
    renderInfo(cur); renderSide(cur); renderGrid(cur);
  }

  function select(id){
    selectedId=id;
    var u=new URL(location.href); u.searchParams.set('id',id); history.replaceState(null,'',u);
    render(true);
    var top=document.querySelector('.lv-layout'); if(top && top.scrollIntoView) top.scrollIntoView({behavior:'smooth',block:'start'});
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-id]'); if(b && b.closest('.lv-side,.lv-grid')){ select(b.dataset.id); return; }
    var t=e.target.closest('#tabs [data-t]'); if(t){ tab=t.dataset.t; render(false); }
  });

  function load(){
    fetch('/api/live-streams').then(function(r){ return r.json(); }).then(function(d){
      var arr=(d&&d.streams)||[], j=JSON.stringify(arr);
      if (j===lastJson) return;          // nothing changed: don't disturb the player
      lastJson=j; streams=arr; render(false);
    }).catch(function(){
      if(!lastJson){ document.getElementById('stage').innerHTML='<div class="lv-none"><h3>Imeshindikana kupakia streams</h3><p>Angalia mtandao kisha ujaribu tena.</p><button class="zp-btn sm" type="button" id="retry">Jaribu tena</button></div>'; var r=document.getElementById('retry'); r&&r.addEventListener('click',load); }
    });
  }
  load();
  setInterval(function(){ if(!document.hidden) load(); },30000);
})();
</script>
</body>
</html>
