<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Live Scores — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="trophy"></div>
    <div><h1>Live Scores</h1><p>Matokeo ya mechi yanayosasishwa na admin. Ukurasa unajisasisha wenyewe kila sekunde 30.</p></div>
    <div class="zp-ph-side">
      <span class="ls-pill live" id="liveCount" hidden><i class="ls-dot"></i><span></span></span>
      <a class="zp-btn ghost" href="live.html"><span data-ic="tv"></span>Watch Live</a>
    </div>
  </header>

  <nav class="zp-tabs" id="statusTabs" aria-label="Hali ya mechi"></nav>
  <div class="zp-chips nowrap-m" id="leagueChips" style="margin-bottom:16px" hidden></div>

  <div id="scores" aria-live="polite"><div class="ls-skel"></div><div class="ls-skel"></div><div class="ls-skel"></div></div>
  <p class="zp-count" id="updated"></p>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  var esc = ZP.esc;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });

  var TABS = [['all','Zote'],['live','Live'],['upcoming','Ratiba'],['ended','Zimekwisha']];
  var tab='all', league='', matches=[], loaded=false, failed=false;

  var statusOf=ZP.match.status, teams=ZP.match.teams, badge=ZP.match.badge, hasScore=ZP.match.hasScore;

  function row(m){
    var st=statusOf(m), t=teams(m), live=st==='live';
    var status = live ? '<b class="live"><i class="ls-dot"></i>LIVE</b>'+(m.minute?'<span>'+esc(m.minute)+'\'</span>':'')
               : st==='ended' ? '<b>FT</b>'
               : '<b>RATIBA</b>'+(m.startTime?'<span>'+esc(m.startTime)+'</span>':'');
    var score = (live||st==='ended') && hasScore(m)
      ? '<div class="ls-score"><span>'+esc(m.homeScore)+'</span><em>–</em><span>'+esc(m.awayScore)+'</span></div>'
      : '<div class="ls-score pending">'+'vs'+'</div>';
    var watch = (m.streamUrl||m.videoUrl) && st!=='ended' ? '<a class="zp-btn sm" href="live.html?id='+encodeURIComponent(m.id)+'">'+ZP.icon('play')+'<span class="lbl">Tazama</span></a>' : '';
    return '<div class="ls-row'+(live?' is-live':'')+'">'+
      '<div class="ls-status">'+status+'</div>'+
      '<div class="ls-team home">'+(t[1]?'<span>'+esc(t[0])+'</span>'+badge(t[0]):'<span>'+esc(t[0])+'</span>')+'</div>'+
      score+
      (t[1]?'<div class="ls-team away">'+badge(t[1])+'<span>'+esc(t[1])+'</span></div>':'<div></div>')+
      '<div class="ls-act">'+watch+'</div></div>';
  }

  function render(){
    var box=document.getElementById('scores');
    var counts={all:matches.length,live:0,upcoming:0,ended:0};
    matches.forEach(function(m){ counts[statusOf(m)]++; });
    var lc=document.getElementById('liveCount');
    lc.hidden=!counts.live; lc.querySelector('span').textContent=counts.live+' LIVE';

    document.getElementById('statusTabs').innerHTML=TABS.map(function(t){
      return '<button type="button" class="zp-chip'+(t[0]===tab?' active':'')+'" data-t="'+t[0]+'">'+t[1]+' <i>'+counts[t[0]]+'</i></button>';
    }).join('');

    var leagues=[]; matches.forEach(function(m){ var l=m.league||'Football'; if(leagues.indexOf(l)<0) leagues.push(l); });
    var lcEl=document.getElementById('leagueChips');
    lcEl.hidden = leagues.length<2;
    if (league && leagues.indexOf(league)<0) league='';
    lcEl.innerHTML='<button type="button" class="zp-chip'+(league?'':' active')+'" data-l="">Ligi zote</button>'+leagues.map(function(l){ return '<button type="button" class="zp-chip'+(l===league?' active':'')+'" data-l="'+esc(l)+'">'+esc(l)+'</button>'; }).join('');

    if (failed && !matches.length){
      box.innerHTML='<div class="zp-empty"><h3>Live Scores haipatikani kwa sasa</h3><p>Angalia mtandao wako kisha jaribu tena.</p><button class="zp-btn" type="button" id="retry">Jaribu tena</button></div>';
      document.getElementById('retry').addEventListener('click',load); return;
    }
    var list=matches.filter(function(m){ return (tab==='all'||statusOf(m)===tab) && (!league || (m.league||'Football')===league); });
    if (!list.length){
      box.innerHTML='<div class="zp-empty"><h3>'+(matches.length?'Hakuna mechi kwenye kundi hili':'Hakuna mechi kwa sasa')+'</h3><p>'+(matches.length?'Chagua kundi lingine hapo juu.':'Mechi zinaonekana hapa admin akiziweka. Angalia pia mashindano ya GameHub.')+'</p><a class="zp-btn ghost" href="tournaments.html">Tournaments</a></div>';
      return;
    }
    var order={live:0,upcoming:1,ended:2};
    list.sort(function(a,b){ return order[statusOf(a)]-order[statusOf(b)]; });
    var groups={}, names=[];
    list.forEach(function(m){ var l=m.league||'Football'; if(!groups[l]){ groups[l]=[]; names.push(l); } groups[l].push(m); });
    box.innerHTML=names.map(function(l){
      return '<section class="ls-league"><header>'+ZP.icon('ball')+'<h3>'+esc(l)+'</h3><small>'+groups[l].length+(groups[l].length===1?' mechi':' mechi')+'</small></header>'+groups[l].map(row).join('')+'</section>';
    }).join('');
    document.getElementById('updated').textContent='Imesasishwa '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }

  function load(){
    fetch('/api/live-streams').then(function(r){ return r.json(); }).then(function(d){
      matches=(d&&d.streams)||[]; failed=false; loaded=true; render();
    }).catch(function(){ failed=true; render(); });
  }
  document.getElementById('statusTabs').addEventListener('click',function(e){ var b=e.target.closest('[data-t]'); if(b){ tab=b.dataset.t; render(); } });
  document.getElementById('leagueChips').addEventListener('click',function(e){ var b=e.target.closest('[data-l]'); if(b){ league=b.dataset.l; render(); } });
  load();
  setInterval(function(){ if(!document.hidden) load(); },30000);
})();
</script>
</body>
</html>
