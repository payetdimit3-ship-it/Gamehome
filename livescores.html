<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Live Scores — Kelvin Gaming TZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
  <link rel="stylesheet" href="zoneplay-v11-final.css">
  <link rel="stylesheet" href="zoneplay-v12-final.css">
  <style>
    /* ============ LIVE SCORES STYLES ============ */
    .ls-pill.live {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ls-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulseDot 1.5s infinite;
      display: inline-block;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* SKELETON */
    .ls-skel {
      height: 80px;
      background: linear-gradient(90deg, #0f0f24 25%, #1a1a3a 50%, #0f0f24 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* MATCH ROW */
    .ls-league {
      margin-bottom: 25px;
    }
    .ls-league header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 15px;
      background: linear-gradient(135deg, #0f0f24, #1a1a3a);
      border-radius: 12px;
      border: 1px solid #1e1e3a;
      margin-bottom: 10px;
    }
    .ls-league header h3 {
      color: #fff;
      font-size: 15px;
      margin: 0;
      flex: 1;
    }
    .ls-league header small {
      color: #7070a0;
      font-size: 11px;
    }

    .ls-row {
      display: grid;
      grid-template-columns: 80px 1fr auto 1fr 90px;
      gap: 12px;
      align-items: center;
      padding: 14px 18px;
      background: #0f0f24;
      border: 1px solid #1e1e3a;
      border-radius: 12px;
      margin-bottom: 8px;
      transition: 0.3s;
    }
    .ls-row:hover {
      border-color: #a855f7;
      transform: translateX(3px);
    }
    .ls-row.is-live {
      border-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
    }

    .ls-status {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      font-size: 11px;
      color: #a0a0c0;
    }
    .ls-status b {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
    }
    .ls-status b.live {
      background: #ef4444;
      color: #fff;
    }
    .ls-status b {
      background: #1e1e3a;
      color: #a0a0c0;
    }

    .ls-team {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ls-team.home { justify-content: flex-start; }
    .ls-team.away { justify-content: flex-end; }

    .ls-team img.team-badge {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .ls-score {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #1a1a3a, #2a1a4a);
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      min-width: 90px;
      justify-content: center;
      flex-shrink: 0;
    }
    .ls-score em {
      font-style: normal;
      color: #7070a0;
      font-size: 16px;
    }
    .ls-score.pending {
      font-size: 13px;
      color: #7070a0;
      font-weight: 600;
    }
    .ls-row.is-live .ls-score {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }

    .ls-act {
      display: flex;
      justify-content: flex-end;
    }
    .ls-act .zp-btn.sm {
      padding: 8px 12px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #fff;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .ls-row {
        grid-template-columns: 70px 1fr auto 1fr 50px;
        gap: 8px;
        padding: 12px;
      }
      .ls-team { font-size: 12px; }
      .ls-score { font-size: 16px; padding: 6px 12px; min-width: 70px; }
      .ls-act .zp-btn.sm .lbl { display: none; }
    }

    /* EMPTY */
    .zp-empty {
      text-align: center;
      padding: 60px 20px;
      background: #0f0f24;
      border: 1px dashed #1e1e3a;
      border-radius: 15px;
    }
    .zp-empty h3 {
      color: #fff;
      margin-bottom: 10px;
      font-size: 18px;
    }
    .zp-empty p {
      color: #a0a0c0;
      font-size: 13px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="trophy"></div>
    <div>
      <h1>Live Scores</h1>
      <p>Matokeo ya mechi za mpira — live kutoka duniani kote</p>
    </div>
    <div class="zp-ph-side">
      <span class="ls-pill live" id="liveCount" hidden>
        <i class="ls-dot"></i>
        <span></span>
      </span>
      <a class="zp-btn ghost" href="live.html">
        <span data-ic="tv"></span>Watch Live
      </a>
    </div>
  </header>

  <nav class="zp-tabs" id="statusTabs" aria-label="Hali ya mechi"></nav>

  <div class="zp-chips nowrap-m" id="leagueChips" style="margin-bottom:16px" hidden></div>

  <div id="scores" aria-live="polite">
    <div class="ls-skel"></div>
    <div class="ls-skel"></div>
    <div class="ls-skel"></div>
  </div>

  <p class="zp-count" id="updated"></p>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  'use strict';

  // ═══════════════════════════════════════════════════
  // 🔗 API CONFIGURATION
  // ═══════════════════════════════════════════════════
  var API_URL = 'https://gaming-platform-ecosystem.onrender.com';

  var esc = (typeof ZP !== 'undefined' && ZP.esc) ? ZP.esc : function(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  };

  // Icons
  document.querySelectorAll('[data-ic]').forEach(function(el){
    if (typeof ZP !== 'undefined' && ZP.icon) {
      el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic));
    }
  });

  // ═══════════════════════════════════════════════════
  // 🎯 STATE
  // ═══════════════════════════════════════════════════
  var TABS = [
    ['all', 'Zote'],
    ['live', 'Live'],
    ['upcoming', 'Ratiba'],
    ['ended', 'Zimekwisha']
  ];
  var tab = 'all';
  var league = '';
  var matches = [];
  var failed = false;

  // ═══════════════════════════════════════════════════
  // 🛠️ HELPERS
  // ═══════════════════════════════════════════════════
  function getStatus(m) {
    if (m.status === 'LIVE' || m.status === 'IN_PLAY' || m.status === 'in') return 'live';
    if (m.status === 'FINISHED' || m.status === 'POST' || m.status === 'post') return 'ended';
    return 'upcoming';
  }

  function hasScore(m) {
    return m.homeScore !== null && m.homeScore !== undefined &&
           m.awayScore !== null && m.awayScore !== undefined &&
           m.homeScore !== '' && m.awayScore !== '';
  }

  function renderBadge(teamName) {
    if (!teamName) return '';
    return ''; // ESPN logos zinatumika kwenye field tofauti
  }

  // ═══════════════════════════════════════════════════
  // 🎨 RENDER ROW
  // ═══════════════════════════════════════════════════
  function row(m) {
    var st = getStatus(m);
    var isLive = st === 'live';
    var isEnded = st === 'ended';

    // Status
    var statusHTML;
    if (isLive) {
      statusHTML = '<b class="live"><i class="ls-dot"></i>LIVE</b>' +
        (m.minute ? '<span>' + esc(m.minute) + "'</span>" : '');
    } else if (isEnded) {
      statusHTML = '<b>FT</b>';
    } else {
      statusHTML = '<b>RATIBA</b>' +
        (m.time || m.startTime ? '<span>' + esc(m.time || m.startTime) + '</span>' : '');
    }

    // Score
    var scoreHTML;
    if ((isLive || isEnded) && hasScore(m)) {
      scoreHTML =
        '<div class="ls-score">' +
        '<span>' + esc(m.homeScore) + '</span>' +
        '<em>–</em>' +
        '<span>' + esc(m.awayScore) + '</span>' +
        '</div>';
    } else {
      scoreHTML = '<div class="ls-score pending">vs</div>';
    }

    // Watch button
    var watch = '';
    if ((m.streamUrl || m.videoUrl) && !isEnded) {
      watch = '<a class="zp-btn sm" href="live.html?id=' + encodeURIComponent(m.id) + '">' +
        (typeof ZP !== 'undefined' && ZP.icon ? ZP.icon('play') : '▶') +
        '<span class="lbl">Tazama</span>' +
        '</a>';
    }

    // Team logo
    var homeLogo = m.homeLogo ? '<img class="team-badge" src="' + esc(m.homeLogo) + '" alt="" onerror="this.style.display=\'none\'">' : '';
    var awayLogo = m.awayLogo ? '<img class="team-badge" src="' + esc(m.awayLogo) + '" alt="" onerror="this.style.display=\'none\'">' : '';

    return '<div class="ls-row' + (isLive ? ' is-live' : '') + '">' +
      '<div class="ls-status">' + statusHTML + '</div>' +
      '<div class="ls-team home">' + homeLogo + '<span>' + esc(m.homeTeam || 'Home') + '</span></div>' +
      scoreHTML +
      '<div class="ls-team away"><span>' + esc(m.awayTeam || 'Away') + '</span>' + awayLogo + '</div>' +
      '<div class="ls-act">' + watch + '</div>' +
      '</div>';
  }

  // ═══════════════════════════════════════════════════
  // 🎨 RENDER ALL
  // ═══════════════════════════════════════════════════
  function render() {
    var box = document.getElementById('scores');

    // Counts
    var counts = { all: matches.length, live: 0, upcoming: 0, ended: 0 };
    matches.forEach(function(m) { counts[getStatus(m)]++; });

    // Live badge
    var lc = document.getElementById('liveCount');
    lc.hidden = !counts.live;
    if (counts.live > 0) {
      lc.querySelector('span').textContent = counts.live + ' LIVE';
    }

    // Tabs
    document.getElementById('statusTabs').innerHTML = TABS.map(function(t) {
      return '<button type="button" class="zp-chip' + (t[0] === tab ? ' active' : '') + '" data-t="' + t[0] + '">' +
        t[1] + ' <i>' + counts[t[0]] + '</i>' +
        '</button>';
    }).join('');

    // League chips
    var leagues = [];
    matches.forEach(function(m) {
      var l = m.league || 'Football';
      if (leagues.indexOf(l) < 0) leagues.push(l);
    });
    var lcEl = document.getElementById('leagueChips');
    lcEl.hidden = leagues.length < 2;
    if (league && leagues.indexOf(league) < 0) league = '';
    lcEl.innerHTML = '<button type="button" class="zp-chip' + (league ? '' : ' active') + '" data-l="">Ligi zote</button>' +
      leagues.map(function(l) {
        return '<button type="button" class="zp-chip' + (l === league ? ' active' : '') + '" data-l="' + esc(l) + '">' +
          esc(l) +
          '</button>';
      }).join('');

    // Empty / Error
    if (failed && !matches.length) {
      box.innerHTML =
        '<div class="zp-empty">' +
        '<h3>Live Scores haipatikani kwa sasa</h3>' +
        '<p>Angalia mtandao wako kisha jaribu tena.</p>' +
        '<button class="zp-btn" type="button" id="retry">Jaribu tena</button>' +
        '</div>';
      document.getElementById('retry').addEventListener('click', load);
      return;
    }

    // Filter
    var list = matches.filter(function(m) {
      return (tab === 'all' || getStatus(m) === tab) &&
             (!league || (m.league || 'Football') === league);
    });

    if (!list.length) {
      box.innerHTML =
        '<div class="zp-empty">' +
        '<h3>' + (matches.length ? 'Hakuna mechi kwenye kundi hili' : 'Hakuna mechi kwa sasa') + '</h3>' +
        '<p>' + (matches.length ? 'Chagua kundi lingine hapo juu.' : 'Mechi zinaonekana hapa admin akiziweka. Angalia pia mashindano ya Kelvin Gaming TZ.') + '</p>' +
        '<a class="zp-btn ghost" href="tournaments.html">Tournaments</a>' +
        '</div>';
      return;
    }

    // Sort: Live first, then upcoming, then ended
    var order = { live: 0, upcoming: 1, ended: 2 };
    list.sort(function(a, b) { return order[getStatus(a)] - order[getStatus(b)]; });

    // Group by league
    var groups = {};
    var names = [];
    list.forEach(function(m) {
      var l = m.league || 'Football';
      if (!groups[l]) {
        groups[l] = [];
        names.push(l);
      }
      groups[l].push(m);
    });

    // Render
    box.innerHTML = names.map(function(l) {
      return '<section class="ls-league">' +
        '<header>' +
        (typeof ZP !== 'undefined' && ZP.icon ? ZP.icon('ball') : '⚽') +
        '<h3>' + esc(l) + '</h3>' +
        '<small>' + groups[l].length + ' ' + (groups[l].length === 1 ? 'mechi' : 'mechi') + '</small>' +
        '</header>' +
        groups[l].map(row).join('') +
        '</section>';
    }).join('');

    document.getElementById('updated').textContent =
      'Imesasishwa ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // ═══════════════════════════════════════════════════
  // 🌐 LOAD DATA — KUTOKA ESPN (v3)
  // ═══════════════════════════════════════════════════
  function load() {
    // Chukua kutoka ESPN endpoint yetu mpya
    fetch(API_URL + '/api/live-scores')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d && d.success && d.all) {
          // Combine live + scheduled + finished
          var combined = []
            .concat(d.live || [])
            .concat(d.scheduled || [])
            .concat(d.finished || []);

          // Deduplicate by id
          var seen = {};
          matches = combined.filter(function(m) {
            if (seen[m.id]) return false;
            seen[m.id] = true;
            return true;
          });
        } else {
          matches = [];
        }
        failed = false;
        render();
      })
      .catch(function(err) {
        console.error('Load error:', err);
        // Fallback: chukua kutoka live-streams (admin)
        fetch(API_URL + '/api/live-streams')
          .then(function(r) { return r.json(); })
          .then(function(d) {
            matches = (d && d.streams) || [];
            failed = false;
            render();
          })
          .catch(function() {
            failed = true;
            matches = [];
            render();
          });
      });
  }

  // ═══════════════════════════════════════════════════
  // 🎯 EVENTS
  // ═══════════════════════════════════════════════════
  document.getElementById('statusTabs').addEventListener('click', function(e) {
    var b = e.target.closest('[data-t]');
    if (b) {
      tab = b.dataset.t;
      render();
    }
  });

  document.getElementById('leagueChips').addEventListener('click', function(e) {
    var b = e.target.closest('[data-l]');
    if (b) {
      league = b.dataset.l;
      render();
    }
  });

  // ═══════════════════════════════════════════════════
  // 🚀 INIT
  // ═══════════════════════════════════════════════════
  load();

  // Auto-refresh kila sekunde 30
  setInterval(function() {
    if (!document.hidden) load();
  }, 30000);

})();
</script>
</body>
</html>
