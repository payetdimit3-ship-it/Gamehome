<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Movies — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="film"></div>
    <div><h1>Movies</h1><p>Video library ya LIFEISGAMETZ — chagua movie na uangalie hapa hapa.</p></div>
  </header>

  <section id="feature" hidden></section>

  <div class="zp-toolbar">
    <label class="zp-search"><span data-ic="search"></span><input type="search" id="q" placeholder="Tafuta movie..." autocomplete="off" aria-label="Tafuta movie"></label>
    <div class="zp-chips" id="genres" role="group" aria-label="Aina ya movie"></div>
    <select id="sortSel" aria-label="Panga" style="height:36px;padding:0 12px;margin-left:auto">
      <option value="new">Mpya kwanza</option>
      <option value="az">A – Z</option>
      <option value="year">Mwaka</option>
    </select>
  </div>
  <p class="zp-count" id="count" aria-live="polite"></p>
  <section class="mv-grid" id="grid"><div class="zp-empty"><p>Inapakia movies...</p></div></section>
</div>

<div class="mv-modal" id="modal" role="dialog" aria-modal="true" aria-label="Movie player" hidden>
  <div class="mv-box">
    <div class="mv-stage" id="stage"><button class="mv-close" id="closeBtn" type="button" aria-label="Funga"></button></div>
    <div class="mv-info" id="mInfo"></div>
  </div>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  var esc=ZP.esc;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });
  document.getElementById('closeBtn').innerHTML=ZP.icon('x');

  var all=[], genre='', q='', sort='new', opener=null;
  var params=new URLSearchParams(location.search);

  function safeUrl(u){ u=String(u||'').trim(); return /^(https?:\/\/|\/)/i.test(u) ? u : ''; }
  function idNum(m){ var n=parseInt(String(m.id||'').replace(/\D/g,''),10); return isNaN(n)?0:n; }
  function ytId(u){
    try{ var x=new URL(u), id='';
      if (x.hostname.indexOf('youtu.be')>-1) id=x.pathname.slice(1);
      else if (x.searchParams.get('v')) id=x.searchParams.get('v');
      else { var z=x.pathname.match(/\/(?:embed|shorts|live)\/([^/?]+)/); if(z) id=z[1]; }
      return /youtube\.com|youtu\.be/.test(x.hostname) ? id : '';
    }catch(e){ return ''; }
  }
  function poster(m,big){
    var p=safeUrl(m.poster);
    return '<span class="'+(big?'mv-big':'mv-emoji')+'" aria-hidden="true">🎬</span>'+(p?'<img src="'+esc(p)+'" alt="" loading="lazy" onerror="this.remove()">':'');
  }

  function renderFeature(){
    var box=document.getElementById('feature'), m=all.slice().sort(function(a,b){ return idNum(b)-idNum(a); })[0];
    if (!m){ box.hidden=true; return; }
    box.hidden=false;
    box.innerHTML='<div class="mv-feature" style="--art:'+ZP.art(m.title)+'">'+poster(m,true)+
      '<div class="mv-feature-body"><span class="zp-slide-tag">MPYA</span><h2>'+esc(m.title)+'</h2>'+(m.description?'<p>'+esc(m.description)+'</p>':'')+
      '<button class="zp-btn" type="button" data-play="'+esc(m.id)+'">'+ZP.icon('play')+'Tazama Sasa</button></div></div>';
  }

  function renderGenres(){
    var gs=[]; all.forEach(function(m){ var g=(m.genre||'Movie').trim(); if(gs.indexOf(g)<0) gs.push(g); });
    var el=document.getElementById('genres'); el.hidden=gs.length<2;
    if (genre && gs.indexOf(genre)<0) genre='';
    el.innerHTML='<button type="button" class="zp-chip'+(genre?'':' active')+'" data-g="">Zote <i>'+all.length+'</i></button>'+gs.map(function(g){
      var n=all.filter(function(m){ return (m.genre||'Movie').trim()===g; }).length;
      return '<button type="button" class="zp-chip'+(g===genre?' active':'')+'" data-g="'+esc(g)+'">'+esc(g)+' <i>'+n+'</i></button>';
    }).join('');
  }

  function render(){
    renderGenres();
    var term=q.trim().toLowerCase();
    var list=all.filter(function(m){ return (!genre||(m.genre||'Movie').trim()===genre) && (!term||(m.title+' '+(m.genre||'')+' '+(m.description||'')).toLowerCase().indexOf(term)>-1); });
    if (sort==='az') list.sort(function(a,b){ return String(a.title).localeCompare(String(b.title)); });
    else if (sort==='year') list.sort(function(a,b){ return (parseInt(b.year,10)||0)-(parseInt(a.year,10)||0); });
    else list.sort(function(a,b){ return idNum(b)-idNum(a); });
    document.getElementById('count').textContent=all.length?list.length+' movies':'';
    document.getElementById('grid').innerHTML=list.length?list.map(function(m){
      return '<button type="button" class="mv-card" data-play="'+esc(m.id)+'" aria-label="Cheza '+esc(m.title)+'"><span class="mv-poster" style="--art:'+ZP.art(m.title)+'">'+poster(m,false)+
        '<span class="mv-tag">'+esc(m.genre||'Movie')+'</span><span class="mv-play">'+ZP.icon('play')+'</span></span>'+
        '<span><h3>'+esc(m.title)+'</h3><small>'+esc(m.year||'')+'</small></span></button>';
    }).join(''):'<div class="zp-empty"><h3>'+(all.length?'Hakuna movie iliyopatikana':'Hakuna movie bado')+'</h3><p>'+(all.length?'Jaribu neno lingine au ondoa kichujio.':'Admin akipakia movie zitaonekana hapa.')+'</p></div>';
  }

  /* ---------- Player modal ---------- */
  var modal=document.getElementById('modal'), stage=document.getElementById('stage');
  function open(id,from){
    var m=all.filter(function(x){ return String(x.id)===String(id); })[0]; if(!m) return;
    opener=from||null;
    var url=safeUrl(m.videoUrl), yt=ytId(url), media, needsClick=false;
    if (!url) media='<div class="cr-none">'+ZP.icon('film')+'<h3>Video haipatikani</h3><p>Movie hii bado haina video.</p></div>';
    else if (ZP.dataSaver()){ needsClick=true; media='<button type="button" class="zp-ds-play" id="mvPlayBtn" style="position:relative;width:100%;height:100%">'+ZP.icon('play')+'<span>Data Saver iko wazi — bonyeza kucheza</span></button>'; }
    else if (yt) media='<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(yt)+'?autoplay=1&rel=0&playsinline=1" title="'+esc(m.title)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    else media='<video controls playsinline autoplay src="'+esc(url)+'"></video>';
    stage.querySelectorAll('iframe,video,.cr-none,.zp-ds-play').forEach(function(n){ n.remove(); });
    stage.insertAdjacentHTML('afterbegin',media);
    if (needsClick){
      document.getElementById('mvPlayBtn').addEventListener('click',function(){
        var real=yt?'<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(yt)+'?autoplay=1&rel=0&playsinline=1" title="'+esc(m.title)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>':'<video controls playsinline autoplay src="'+esc(url)+'"></video>';
        stage.querySelectorAll('.zp-ds-play').forEach(function(n){ n.remove(); });
        stage.insertAdjacentHTML('afterbegin',real);
      });
    }
    document.getElementById('mInfo').innerHTML='<div class="cr-meta"><span class="ls-pill">'+esc((m.genre||'Movie').toUpperCase())+'</span>'+(m.year?'<span class="ls-pill">'+esc(m.year)+'</span>':'')+'</div><h2>'+esc(m.title)+'</h2>'+(m.description?'<p>'+esc(m.description)+'</p>':'');
    modal.hidden=false; modal.classList.add('on'); document.body.style.overflow='hidden'; document.body.classList.add('mv-open');
    var u=new URL(location.href); u.searchParams.set('id',m.id); history.replaceState(null,'',u.pathname+u.search);
    document.getElementById('closeBtn').focus();
  }
  function close(){
    stage.querySelectorAll('iframe,video,.cr-none').forEach(function(n){ n.remove(); });   // stops playback
    modal.classList.remove('on'); modal.hidden=true; document.body.style.overflow=''; document.body.classList.remove('mv-open');
    var u=new URL(location.href); u.searchParams.delete('id'); history.replaceState(null,'',u.pathname+u.search);
    if (opener && opener.focus) opener.focus();
  }
  document.addEventListener('click',function(e){
    var p=e.target.closest('[data-play]'); if(p){ open(p.dataset.play,p); return; }
    if (e.target===modal || e.target.closest('#closeBtn')) { close(); return; }
    var g=e.target.closest('#genres [data-g]'); if(g){ genre=g.dataset.g; render(); }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && modal.classList.contains('on')) close(); });
  document.getElementById('q').addEventListener('input',function(e){ q=e.target.value; render(); });
  document.getElementById('sortSel').addEventListener('change',function(e){ sort=e.target.value; render(); });

  fetch('/api/movies').then(function(r){ return r.json(); }).then(function(d){
    all=(d&&d.movies)||[]; renderFeature(); render();
    var id=params.get('id'); if(id) open(id,null);
  }).catch(function(){
    document.getElementById('grid').innerHTML='<div class="zp-empty"><h3>Imeshindikana kupakia movies</h3><p>Angalia mtandao kisha jaribu tena.</p><button class="zp-btn" type="button" onclick="location.reload()">Jaribu tena</button></div>';
  });
})();
</script>
</body>
</html>
