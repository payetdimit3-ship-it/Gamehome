<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Game Requests — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="search"></div>
    <div><h1>Omba Game Yako</h1><p>Game haipo dukani? Omba hapa — inayopata kura nyingi tunaiweka kwanza.</p></div>
  </header>

  <div class="rq-form">
    <input type="text" id="gameName" placeholder="Jina la game (mfano: Elden Ring)" autocomplete="off">
    <button class="zp-btn" id="sendBtn" type="button"></button>
    <p class="rq-msg" id="formMsg"></p>
  </div>

  <div class="zp-sec" style="margin-top:0"><h2>Games Zinazoombwa</h2></div>
  <p class="zp-count" style="margin-top:-8px">Piga kura kwenye game unayoitaka — inayopata kura nyingi inaingia dukani kwanza.</p>
  <div class="rq-list" id="list" aria-live="polite"></div>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  var esc=ZP.esc, token=localStorage.getItem('gamehubToken');
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });
  document.getElementById('sendBtn').innerHTML=ZP.icon('arrow')+'Tuma Ombi';

  function fmsg(t,ok){ var m=document.getElementById('formMsg'); m.textContent=t||''; m.className='rq-msg'+(ok?' ok':''); }

  document.getElementById('sendBtn').addEventListener('click',function(){
    var input=document.getElementById('gameName'), name=input.value.trim();
    if (!name){ fmsg('Andika jina la game kwanza.'); return; }
    if (!token){ fmsg('Ingia kwanza kuomba game. Inakupeleka...'); setTimeout(function(){ location.href='login.html?return=requests.html'; },1000); return; }
    fmsg('');
    fetch('/api/requests',{method:'POST',headers:{'Authorization':token,'Content-Type':'application/json'},body:JSON.stringify({gameName:name})})
      .then(function(r){ return r.json(); })
      .then(function(d){ fmsg(d.message||d.error, !!d.success); if (d.success){ input.value=''; load(); } })
      .catch(function(){ fmsg('Hitilafu ya mtandao. Jaribu tena.'); });
  });
  document.getElementById('gameName').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('sendBtn').click(); });

  function row(r,i){
    var top=i===0;
    return '<article class="rq-row'+(top?' top':'')+'"><span class="rq-rank">'+(top?'🏆':'#'+(i+1))+'</span>'+
      '<div class="rq-info"><h3>'+esc(r.name)+'</h3><span>Kura: <strong style="color:var(--cyan)">'+r.votes+'</strong> '+(r.votes>1?'wateja wanaitaka':'mteja anaitaka')+'</span></div>'+
      '<div class="rq-vote"><button class="zp-btn sm" type="button" data-vote="'+esc(r.id)+'">'+ZP.icon('star')+'Naitaka</button><small data-vmsg="'+esc(r.id)+'"></small></div></article>';
  }
  function load(){
    var box=document.getElementById('list');
    fetch('/api/requests').then(function(r){ return r.json(); }).then(function(d){
      var list=(d.success&&d.requests)||[];
      box.innerHTML=list.length ? list.map(row).join('') : '<div class="zp-empty"><h3>Hakuna ombi bado</h3><p>Kuwa wa kwanza kuomba game yako!</p></div>';
    }).catch(function(){ box.innerHTML='<div class="zp-empty"><h3>Imeshindikana kupakia orodha</h3><p>Angalia mtandao kisha jaribu tena.</p><button class="zp-btn" type="button" onclick="location.reload()">Jaribu tena</button></div>'; });
  }
  document.getElementById('list').addEventListener('click',function(e){
    var b=e.target.closest('[data-vote]'); if(!b) return;
    var id=b.dataset.vote, note=document.querySelector('[data-vmsg="'+id+'"]');
    if (!token){ note.textContent='Ingia kwanza'; note.style.color='#ff9db3'; setTimeout(function(){ location.href='login.html?return=requests.html'; },900); return; }
    b.disabled=true;
    fetch('/api/requests/'+encodeURIComponent(id)+'/vote',{method:'POST',headers:{'Authorization':token}})
      .then(function(r){ return r.json(); })
      .then(function(d){
        note.textContent=d.message||d.error||''; note.style.color=d.success?'#7ff0b0':'#ffd98a';
        if (d.success) setTimeout(load,900); else b.disabled=false;
      })
      .catch(function(){ note.textContent='Hitilafu ya mtandao.'; note.style.color='#ff9db3'; b.disabled=false; });
  });

  load();
})();
</script>
</body>
</html>
