<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signing in — LIFEISGAMETZ</title><link rel="stylesheet" href="zoneplay-four-reference.css"></head><body style="margin:0;background:#020a1d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh"><div style="padding:28px 32px;border:1px solid #3f1fc4;border-radius:18px;background:#07112b;text-align:center;max-width:420px"><div style="font-size:28px">✦</div><h2>Inaingia...</h2><p id="msg" style="color:#9fb0d0">Tafadhali subiri tunakamilisha login yako.</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const msg=document.getElementById('msg');try{const c=await (await fetch('/api/auth/social/config')).json();if(!c.enabled)throw new Error('Social login haija-configurewa kwenye server.');const sb=window.supabase.createClient(c.url,c.anonKey);const {data,error}=await sb.auth.getSession();if(error||!data.session)throw new Error('Session ya provider haikupatikana.');const provider=(data.session.user.app_metadata?.provider||'').toLowerCase();const r=await fetch('/api/auth/social/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:data.session.access_token,provider})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Social login failed');localStorage.setItem('gamehubToken',d.token);localStorage.setItem('gamehubUser',JSON.stringify(d.user));await sb.auth.signOut();location.replace('index.html')}catch(e){msg.textContent='❌ '+e.message+' — Rudi Login ujaribu tena.';setTimeout(()=>location.replace('login.html'),3500)}})();</script></body></html>
