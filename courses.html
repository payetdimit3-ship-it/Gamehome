<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Courses + AI Tutor — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="cap"></div>
    <div><h1>Courses + AI Tutor</h1><p>Angalia video za somo, kisha uliza AI Tutor kwa maandishi au sauti.</p></div>
    <div class="zp-ph-side opt"><a class="zp-btn ghost" href="academy.html"><span data-ic="grid"></span>Academy Home</a></div>
  </header>

  <nav class="zp-tabs" id="courseTabs" aria-label="Kozi" hidden></nav>

  <div class="cr-layout">
    <div>
      <div class="cr-stage" id="stage"><div class="cr-none"><h3>Inapakia...</h3></div></div>
      <div class="cr-info" id="info" hidden></div>
    </div>
    <aside class="cr-list" id="listBox" hidden>
      <header><h3 id="listTitle">Masomo</h3><small id="listCount"></small></header>
      <div class="cr-vids" id="vids"></div>
    </aside>
  </div>

  <section class="cr-tutor" id="tutor">
    <header>
      <div class="zp-ph-ic" data-ic="bot"></div>
      <div><h2>AI Course Tutor</h2><p>Uliza kuhusu lesson, code, assignment au concept. Bonyeza kipaza sauti kuongea.</p></div>
    </header>
    <div class="cr-msgs" id="msgs" aria-live="polite"><div class="cr-msg bot">Habari! Mimi ni AI Tutor wa Course. Unaweza kuandika au kuongea.</div></div>
    <div class="cr-input">
      <input id="q" placeholder="Uliza swali kuhusu course..." aria-label="Swali lako" autocomplete="off">
      <button class="zp-btn ghost" id="mic" type="button" aria-label="Ongea"></button>
      <button class="zp-btn" id="send" type="button" aria-label="Tuma"></button>
    </div>
    <div class="cr-tools">
      <button class="zp-btn ghost sm" id="speak" type="button"></button>
      <button class="zp-btn ghost sm" id="stop" type="button">Stop</button>
    </div>
  </section>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  var esc=ZP.esc;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });
  document.getElementById('mic').textContent='🎙️';
  document.getElementById('send').innerHTML=ZP.icon('arrow');
  document.getElementById('speak').innerHTML='🔊 Soma jibu la mwisho';

  var params=new URLSearchParams(location.search);
  var courses=[], cid=params.get('id')||'', vid=params.get('v')||'';

  function course(){ return courses.filter(function(c){ return c.id===cid; })[0] || courses[0] || null; }
  function video(c){ var v=(c&&c.videos)||[]; return v.filter(function(x){ return x.id===vid; })[0] || v[0] || null; }
  function setUrl(){ var u=new URL(location.href); u.searchParams.set('id',cid); if(vid) u.searchParams.set('v',vid); history.replaceState(null,'',u.pathname+u.search+u.hash); }

  function renderTabs(c){
    var t=document.getElementById('courseTabs');
    t.hidden=courses.length<2;
    t.innerHTML=courses.map(function(x){ return '<button type="button" class="zp-chip'+(c&&x.id===c.id?' active':'')+'" data-c="'+esc(x.id)+'">'+esc(x.name)+'</button>'; }).join('');
  }
  function renderStage(c,v,play){
    var stage=document.getElementById('stage'), info=document.getElementById('info');
    if (!c){
      stage.innerHTML='<div class="cr-none">'+ZP.icon('cap')+'<h3>Hakuna kozi bado</h3><p>Admin akiongeza kozi na video zitaonekana hapa. Kwa sasa unaweza kuuliza AI Tutor hapa chini.</p></div>';
      info.hidden=true; return;
    }
    if (!v){
      stage.innerHTML='<div class="cr-none">'+ZP.icon('play')+'<h3>Video bado hazijawekwa</h3><p>Kozi hii inaandaliwa. Rudi hivi karibuni.</p></div>';
    } else {
      stage.innerHTML='<video controls playsinline preload="metadata" src="'+esc(v.url)+'"'+(play?' autoplay':'')+'></video>';
      var el=stage.querySelector('video');
      el.addEventListener('ended',function(){
        var list=c.videos||[], i=list.indexOf(v);
        if (i>-1 && i<list.length-1) pick(list[i+1].id,true);
      });
    }
    info.hidden=false;
    var n=(c.videos||[]).length;
    info.innerHTML='<div class="cr-meta"><span class="ls-pill">'+esc((c.level||'Beginner').toUpperCase())+'</span><span class="ls-pill">'+n+' VIDEO</span><span class="ls-pill">'+(Number(c.price)>0?ZP.money(c.price)+' TZS':'BURE')+'</span></div>'+
      '<h2>'+esc(v?v.title:c.name)+'</h2>'+(v&&v.description?'<p>'+esc(v.description)+'</p>':'')+(v?'<p style="color:var(--dim);font-size:12.5px">Kozi: '+esc(c.name)+'</p>':'')+(c.description&&!(v&&v.description)?'<p>'+esc(c.description)+'</p>':'');
  }
  function renderList(c,v){
    var box=document.getElementById('listBox'), n=c?(c.videos||[]).length:0;
    box.hidden=!c || !n;
    if (!c||!n) return;
    document.getElementById('listTitle').textContent=c.name;
    document.getElementById('listCount').textContent=n+(n===1?' somo':' masomo');
    document.getElementById('vids').innerHTML=c.videos.map(function(x,i){
      return '<button type="button" class="cr-vid'+(v&&x.id===v.id?' on':'')+'" data-v="'+esc(x.id)+'"><i>'+(i+1)+'</i><span><b>'+esc(x.title)+'</b>'+(x.description?'<small>'+esc(x.description.slice(0,70))+'</small>':'')+'</span><small>'+esc(x.duration||'')+'</small></button>';
    }).join('');
  }
  function render(play){ var c=course(), v=video(c); if(c){ cid=c.id; } renderTabs(c); renderStage(c,v,play); renderList(c,v); }
  function pick(id,play){ vid=id; setUrl(); render(!!play); }

  document.addEventListener('click',function(e){
    var t=e.target.closest('#courseTabs [data-c]'); if(t){ cid=t.dataset.c; vid=''; setUrl(); render(false); return; }
    var b=e.target.closest('#vids [data-v]'); if(b){ pick(b.dataset.v,true); var s=document.getElementById('stage'); s.scrollIntoView&&s.scrollIntoView({behavior:'smooth',block:'center'}); }
  });

  fetch('/api/courses').then(function(r){ return r.json(); }).then(function(d){ courses=(d&&d.courses)||[]; render(false); })
    .catch(function(){ document.getElementById('stage').innerHTML='<div class="cr-none"><h3>Imeshindikana kupakia kozi</h3><p>Angalia mtandao kisha jaribu tena.</p><button class="zp-btn sm" type="button" onclick="location.reload()">Jaribu tena</button></div>'; });

  /* ---------- AI Tutor ---------- */
  var lastReply='', msgs=document.getElementById('msgs'), input=document.getElementById('q'), busy=false;
  function add(t,c){ var d=document.createElement('div'); d.className='cr-msg '+c; d.textContent=t; msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; }
  function ask(){
    var q=input.value.trim(); if(!q||busy) return;
    add(q,'user'); input.value=''; busy=true;
    var wait=add('Ninafikiria...','bot wait');
    var c=course(), v=video(c);
    var ctx=c?(' ['+c.name+(v?' — '+v.title:'')+']'):'';
    fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:ZP.aiMessage('Course Tutor'+ctx+': '+q)})})
      .then(function(r){ return r.json(); })
      .then(function(d){ lastReply=d.reply||d.error||'Samahani, jaribu tena.'; wait.className='cr-msg bot'; wait.textContent=lastReply; })
      .catch(function(){ wait.className='cr-msg bot'; wait.textContent='Hitilafu ya mtandao. Jaribu tena.'; })
      .then(function(){ busy=false; msgs.scrollTop=msgs.scrollHeight; });
  }
  document.getElementById('send').addEventListener('click',ask);
  input.addEventListener('keydown',function(e){ if(e.key==='Enter') ask(); });
  document.getElementById('speak').addEventListener('click',function(){ if(lastReply&&'speechSynthesis' in window){ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(lastReply)); } });
  document.getElementById('stop').addEventListener('click',function(){ if('speechSynthesis' in window) speechSynthesis.cancel(); });
  document.getElementById('mic').addEventListener('click',function(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ add('Browser yako haiungi mkono voice input. Tumia Chrome.','bot'); return; }
    var r=new SR(); r.lang='sw-TZ'; r.interimResults=false;
    r.onresult=function(e){ input.value=e.results[0][0].transcript; ask(); };
    r.start();
  });
  if (location.hash==='#tutor') setTimeout(function(){ var t=document.getElementById('tutor'); t&&t.scrollIntoView({behavior:'smooth'}); input.focus(); },400);
})();
</script>
</body>
</html>
