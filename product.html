<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
  <style>
    /* ===== PRODUCT PAGE V2 — MODERN LAYOUT ===== */
    .p2-wrap { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .p2-breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .p2-breadcrumb a { color: #a78bfa; text-decoration: none; }
    .p2-breadcrumb a:hover { text-decoration: underline; }

    .p2-top { display: grid; grid-template-columns: 1fr 380px; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 1000px) { .p2-top { grid-template-columns: 1fr; } }

    /* LEFT: Gallery */
    .p2-gallery { display: grid; grid-template-columns: 90px 1fr; gap: 12px; }
    @media (max-width: 600px) { .p2-gallery { grid-template-columns: 1fr; } .p2-thumbs { display: flex; flex-direction: row; overflow-x: auto; } }
    .p2-thumbs { display: flex; flex-direction: column; gap: 8px; }
    .p2-thumbs img, .p2-thumbs .th { width: 90px; height: 90px; border-radius: 10px; object-fit: cover; background: rgba(255,255,255,.04); border: 2px solid transparent; cursor: pointer; display: grid; place-items: center; font-size: 34px; }
    .p2-thumbs .th.on { border-color: #7c3aed; }
    .p2-main { border-radius: 14px; overflow: hidden; background: #0d0d20; aspect-ratio: 16/9; display: grid; place-items: center; position: relative; }
    .p2-main img { width: 100%; height: 100%; object-fit: cover; }
    .p2-main .big-emoji { font-size: 140px; }
    .p2-badge { position: absolute; top: 14px; left: 14px; padding: 6px 12px; border-radius: 8px; background: linear-gradient(135deg,#7c3aed,#4c1d95); color: #fff; font-size: 12px; font-weight: 700; }
    .p2-play { position: absolute; inset: 0; display: grid; place-items: center; font-size: 60px; color: #fff; background: rgba(0,0,0,.3); cursor: pointer; }

    /* RIGHT: Info panel */
    .p2-info { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 20px; height: fit-content; }
    .p2-info h1 { margin: 0 0 10px; font-size: 24px; }
    .p2-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .p2-tags span { padding: 4px 10px; border-radius: 6px; background: rgba(124,58,237,.15); color: #a78bfa; font-size: 11.5px; font-weight: 600; }
    .p2-rating { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
    .p2-rating .stars { color: #ffb020; }
    .p2-platforms { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .p2-platforms button { padding: 8px 14px; border-radius: 8px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .p2-platforms button.on { background: #7c3aed; border-color: #7c3aed; }
    .p2-price { display: flex; align-items: baseline; gap: 10px; margin: 14px 0; }
    .p2-price .now { font-size: 30px; font-weight: 800; color: #fff; }
    .p2-price .old { font-size: 15px; color: var(--muted); text-decoration: line-through; }
    .p2-price .off { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(34,197,94,.2); color: #86efac; font-weight: 700; }

    .p2-delivery { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; background: rgba(124,58,237,.08); border: 1px solid rgba(124,58,237,.2); margin-bottom: 14px; font-size: 12.5px; color: #c9d4f0; }
    .p2-delivery i { font-style: normal; font-size: 20px; }

    .p2-qty { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .p2-qty label { font-size: 13px; color: var(--muted); }
    .p2-qty-btns { display: flex; align-items: center; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); }
    .p2-qty-btns button { width: 34px; height: 34px; background: rgba(255,255,255,.05); border: none; color: #fff; font-size: 16px; cursor: pointer; }
    .p2-qty-btns span { padding: 0 14px; font-size: 14px; font-weight: 600; }

    .p2-buttons { display: flex; gap: 8px; margin-bottom: 14px; }
    .p2-buttons button, .p2-buttons a {
      flex: 1; padding: 14px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 700; text-decoration: none; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .p2-add { background: linear-gradient(135deg,#7c3aed,#4c1d95); color: #fff; }
    .p2-wish { background: rgba(255,255,255,.05); color: #fff; border: 1px solid rgba(255,255,255,.1) !important; flex: 0 0 auto !important; width: 50px; }

    .p2-trust-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); font-size: 10.5px; color: var(--muted); text-align: center; }
    .p2-trust-row div b { display: block; color: #fff; font-size: 11.5px; margin: 2px 0; }
    .p2-trust-row div i { font-style: normal; font-size: 18px; display: block; margin-bottom: 4px; }

    /* TABS */
    .p2-tabs { display: flex; gap: 4px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 18px; overflow-x: auto; }
    .p2-tab { padding: 12px 18px; background: transparent; border: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
    .p2-tab.on { color: #fff; border-bottom-color: #7c3aed; }
    .p2-tab-content { padding: 4px; }
    .p2-tab-content h3 { margin: 0 0 10px; font-size: 17px; }
    .p2-tab-content p { color: #c9d4f0; line-height: 1.6; font-size: 13.5px; }
    .p2-feat-list { list-style: none; padding: 0; display: grid; gap: 8px; }
    .p2-feat-list li { color: #c9d4f0; font-size: 13.5px; }

    /* Details grid */
    .p2-details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
    @media (max-width: 700px) { .p2-details-grid { grid-template-columns: 1fr; } }
    .p2-detail-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
    .p2-detail-row i { font-style: normal; font-size: 18px; width: 24px; }
    .p2-detail-row b { display: block; color: #fff; }
    .p2-detail-row span { color: var(--muted); }

    /* Trailer */
    .p2-trailer { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 16px; }
    .p2-trailer h3 { margin: 0 0 12px; }
    .p2-trailer iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; }
    .p2-trailer .thumb { aspect-ratio: 16/9; border-radius: 12px; background: #0d0d20; display: grid; place-items: center; position: relative; cursor: pointer; }
    .p2-trailer .thumb .play { font-size: 50px; }
    .p2-trailer .caption { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12.5px; color: var(--muted); }

    /* Reviews */
    .p2-reviews { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 20px; margin-top: 24px; }
    .p2-reviews-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .p2-reviews-h h3 { margin: 0; }
    .p2-review-summary { display: grid; grid-template-columns: 140px 1fr; gap: 20px; padding-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,.05); margin-bottom: 18px; }
    @media (max-width: 700px) { .p2-review-summary { grid-template-columns: 1fr; } }
    .p2-score-big { font-size: 42px; font-weight: 800; color: #fff; line-height: 1; }
    .p2-score-stars { color: #ffb020; margin: 6px 0; }
    .p2-score-sub { font-size: 12px; color: var(--muted); }
    .p2-hist { display: flex; flex-direction: column; gap: 6px; }
    .p2-hist-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
    .p2-hist-bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; }
    .p2-hist-bar > span { display: block; height: 100%; background: linear-gradient(90deg,#7c3aed,#4c1d95); }

    .p2-review-item { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid rgba(255,255,255,.05); }
    .p2-review-item .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#7c3aed,#4c1d95); display: grid; place-items: center; font-weight: 700; color: #fff; }
    .p2-review-item .meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
    .p2-review-item .stars { color: #ffb020; }
    .p2-review-item p { margin: 6px 0 0; color: #c9d4f0; font-size: 13.5px; line-height: 1.5; }

    /* Related */
    .p2-related { margin-top: 30px; }
    .p2-related-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .p2-related-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    @media (max-width: 1000px) { .p2-related-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .p2-related-grid { grid-template-columns: repeat(2, 1fr); } }
    .p2-related-card { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 10px; text-align: center; text-decoration: none; color: #fff; transition: .15s; }
    .p2-related-card:hover { border-color: #7c3aed; transform: translateY(-2px); }
    .p2-related-card .img { aspect-ratio: 3/4; border-radius: 8px; background: linear-gradient(135deg,#7c3aed,#4c1d95); display: grid; place-items: center; font-size: 50px; margin-bottom: 8px; }
    .p2-related-card b { display: block; font-size: 12.5px; line-height: 1.3; margin-bottom: 4px; }
    .p2-related-card small { color: #a78bfa; font-size: 11.5px; }
    .p2-related-card .plats { display: flex; justify-content: center; gap: 4px; margin-top: 6px; font-size: 10px; color: var(--muted); }

    /* Review form */
    .p2-review-form { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 16px; margin-top: 20px; }
    .p2-review-form h4 { margin: 0 0 12px; font-size: 15px; }
    .p2-review-form select, .p2-review-form input { width: 100%; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 13px; margin-bottom: 10px; font-family: inherit; }
    .p2-review-form button { padding: 12px 20px; border-radius: 8px; background: linear-gradient(135deg,#7c3aed,#4c1d95); color: #fff; border: none; font-weight: 700; cursor: pointer; }
    .p2-msg { font-size: 13px; margin-top: 8px; color: var(--muted); }
  </style>
</head>
<body>

<div class="main">
  <div class="p2-wrap">

    <!-- Breadcrumb -->
    <div class="p2-breadcrumb">
      <a href="index.html">🏠 Home</a> › <a href="shop.html">Store</a> › <span id="crumbName">Inapakia...</span>
    </div>

    <div id="productContainer">
      <h2 style="text-align:center;padding:40px">Inapakia...</h2>
    </div>

  </div>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>

<script>
(function(){
  const esc = ZP && ZP.esc ? ZP.esc : function(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || params.get('game') || '';
  const container = document.getElementById('productContainer');

  if (!id) {
    container.innerHTML = '<div style="text-align:center;padding:40px"><h2>😕 Bidhaa haipatikani</h2><a class="zp-btn" href="shop.html">← Rudi Dukani</a></div>';
    return;
  }

  function ytId(url) {
    const m = String(url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
    return m ? m[1] : '';
  }

  function money(n){ return 'TSh ' + Number(n||0).toLocaleString(); }

  function render(p) {
    document.getElementById('crumbName').textContent = p.name;
    document.title = p.name + ' — LIFEISGAMETZ';

    const priceNum = Number(p.priceNumber || String(p.price||'').replace(/[^\d]/g,'')) || 0;
    const oldPrice = priceNum ? Math.round(priceNum * 1.35) : 0;
    const off = priceNum ? Math.round(((oldPrice - priceNum) / oldPrice) * 100) : 0;

    const imgs = [p.imageUrl, p.image2, p.image3, p.image4].filter(Boolean);
    const trailerId = ytId(p.trailerUrl);

    const mainMedia = imgs.length
      ? '<img id="mainImg" src="' + esc(imgs[0]) + '" alt="' + esc(p.name) + '">'
      : '<span class="big-emoji">' + esc(p.emoji || '🎮') + '</span>';

    const thumbs = imgs.length > 1
      ? '<div class="p2-thumbs">' + imgs.map(function(u,i){
          return '<img src="' + esc(u) + '" class="th ' + (i===0?'on':'') + '" data-i="' + i + '">';
        }).join('') + '</div>'
      : '<div class="p2-thumbs"><span class="th on">' + esc(p.emoji || '🎮') + '</span></div>';

    const features = (p.features && p.features.length) ? p.features : [
      'Authentic teams, leagues na players',
      'Improved gameplay na new features',
      'Ultimate Team, Career Mode, Clubs na more',
      'Cross-play na online multiplayer'
    ];

    const details = [
      { ico: '🎮', label: 'Genre', value: p.genre || p.type || 'Sports' },
      { ico: '🏢', label: 'Developer', value: p.developer || 'GameHub Studios' },
      { ico: '📅', label: 'Release Date', value: p.releaseDate || 'Sep 26, 2025' },
      { ico: '🌍', label: 'Languages', value: p.languages || 'English, French, Spanish, German, Italian + more' }
    ];

    const platforms = ['PS5', 'PS4', 'Xbox', 'PC', 'Switch'];

    container.innerHTML = `
      <div class="p2-top">
        <div class="p2-gallery">
          ${thumbs}
          <div class="p2-main">
            <span class="p2-badge">Best Seller</span>
            ${mainMedia}
          </div>
        </div>

        <div class="p2-info">
          <div class="p2-tags">
            ${[p.type || 'EA SPORTS', 'Sports', 'Football', 'Multiplayer'].map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('')}
          </div>
          <h1>${esc(p.name)}</h1>
          <div class="p2-rating">
            <span class="stars">★★★★★</span>
            <span><b style="color:#fff">4.7</b> (2,543 reviews)</span>
          </div>

          <div class="p2-platforms">
            ${platforms.map(function(pl,i){ return '<button type="button" class="' + (i===0?'on':'') + '">' + pl + '</button>'; }).join('')}
          </div>

          <div class="p2-price">
            <span class="now">${money(priceNum)}</span>
            <span class="old">${money(oldPrice)}</span>
            <span class="off">-${off}%</span>
          </div>

          <div class="p2-delivery">
            <i>⚡</i>
            <div><b style="color:#fff">Digital Download</b><br>Instant delivery after purchase</div>
          </div>

          <div class="p2-qty">
            <label>Quantity</label>
            <div class="p2-qty-btns">
              <button type="button" id="qtyDec">−</button>
              <span id="qtyVal">1</span>
              <button type="button" id="qtyInc">+</button>
            </div>
          </div>

          <div class="p2-buttons">
            <button class="p2-add" id="addCart">🛒 Add to Cart</button>
            <button class="p2-wish" id="wish" title="Wishlist">🤍</button>
          </div>

          <div class="p2-trust-row">
            <div><i>⚡</i><b>Instant Delivery</b>Get your code immediately</div>
            <div><i>🔒</i><b>Secure Payment</b>100% safe &amp; encrypted</div>
            <div><i>🎧</i><b>24/7 Support</b>We're here to help</div>
          </div>
        </div>
      </div>

      <div class="p2-tabs" id="tabs">
        <button class="p2-tab on" data-t="overview">Overview</button>
        <button class="p2-tab" data-t="features">Features</button>
        <button class="p2-tab" data-t="req">System Requirements</button>
        <button class="p2-tab" data-t="reviews">Reviews (2,543)</button>
      </div>

      <div class="p2-tab-content" id="tabOverview">
        <div style="display:grid; grid-template-columns:1.3fr 1fr; gap:24px;" class="p2-details-grid">
          <div>
            <h3>About This Game</h3>
            <p>${esc(p.desc || 'Bidhaa ya GameHub.')}</p>
            <ul class="p2-feat-list" style="margin-top:14px">
              ${features.map(function(f){ return '<li>✅ ' + esc(f) + '</li>'; }).join('')}
            </ul>
          </div>
          <div>
            ${details.map(function(d){
              return '<div class="p2-detail-row"><i>' + d.ico + '</i><div><b>' + esc(d.label) + '</b><span>' + esc(d.value) + '</span></div></div>';
            }).join('')}
          </div>
        </div>
      </div>

      <div class="p2-tab-content" id="tabFeatures" hidden>
        <h3>Features</h3>
        <ul class="p2-feat-list">
          ${features.map(function(f){ return '<li>✅ ' + esc(f) + '</li>'; }).join('')}
        </ul>
      </div>

      <div class="p2-tab-content" id="tabReq" hidden>
        <h3>System Requirements</h3>
        <div class="p2-details-grid">
          <div><b style="color:#fff">Minimum</b><p>OS: Windows 10 64-bit · CPU: Intel Core i5-6600K · RAM: 8 GB · GPU: NVIDIA GTX 1050 Ti · Storage: 50 GB</p></div>
          <div><b style="color:#fff">Recommended</b><p>OS: Windows 11 64-bit · CPU: Intel Core i7-9700 · RAM: 16 GB · GPU: NVIDIA RTX 2060 · Storage: 50 GB SSD</p></div>
        </div>
      </div>

      <div class="p2-tab-content" id="tabReviews" hidden>
        <div id="reviewsContent"><p style="color:var(--muted)">Inapakia maoni...</p></div>
      </div>

      <div class="p2-trailer" style="margin-top:24px">
        <h3>🎬 Game Trailer</h3>
        ${trailerId
          ? '<iframe src="https://www.youtube.com/embed/' + trailerId + '" allowfullscreen title="Trailer"></iframe>'
          : '<div class="thumb" style="background:linear-gradient(135deg,#7c3aed,#4c1d95)"><span class="play">▶️</span></div>'}
        <div class="caption">
          <span>${esc(p.name)} Official Trailer</span>
          <span>2:48</span>
        </div>
      </div>

      <div class="p2-related">
        <div class="p2-related-h">
          <h3>Related Products</h3>
          <a href="shop.html" style="color:#a78bfa;text-decoration:none;font-size:13px">View All →</a>
        </div>
        <div class="p2-related-grid" id="relatedGrid"></div>
      </div>
    `;

    /* === Thumbnail gallery === */
    container.querySelectorAll('.p2-thumbs .th').forEach(function(t){
      t.addEventListener('click', function(){
        const i = Number(t.dataset.i || 0);
        const main = document.getElementById('mainImg');
        if (main && imgs[i]) main.src = imgs[i];
        container.querySelectorAll('.p2-thumbs .th').forEach(function(x){ x.classList.remove('on'); });
        t.classList.add('on');
      });
    });

    /* === Platform selector === */
    container.querySelectorAll('.p2-platforms button').forEach(function(b){
      b.addEventListener('click', function(){
        container.querySelectorAll('.p2-platforms button').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on');
      });
    });

    /* === Quantity === */
    let qty = 1;
    document.getElementById('qtyInc').addEventListener('click', function(){ qty++; document.getElementById('qtyVal').textContent = qty; });
    document.getElementById('qtyDec').addEventListener('click', function(){ if (qty > 1) qty--; document.getElementById('qtyVal').textContent = qty; });

    /* === Add to cart === */
    document.getElementById('addCart').addEventListener('click', function(){
      const cart = JSON.parse(localStorage.getItem('gamehubCart') || '{}');
      const key = id;
      if (cart[key]) cart[key].qty += qty;
      else cart[key] = { id: key, name: p.name, emoji: p.emoji || '🎮', price: p.price, num: priceNum, qty: qty, downloadLink: p.downloadLink || '', accountUser: p.accountUser || '', accountPassword: p.accountPassword || '', imageUrl: p.imageUrl || '' };
      localStorage.setItem('gamehubCart', JSON.stringify(cart));
      if (typeof updateCartBadge === 'function') updateCartBadge();
      this.textContent = '✅ Imeongezwa!';
      const self = this;
      setTimeout(function(){ self.textContent = '🛒 Add to Cart'; }, 1500);
    });

    /* === Wishlist === */
    const wishBtn = document.getElementById('wish');
    function refreshWish(){
      const w = JSON.parse(localStorage.getItem('gamehubWishlist') || '{}');
      wishBtn.textContent = w[id] ? '❤️' : '🤍';
    }
    wishBtn.addEventListener('click', function(){
      const w = JSON.parse(localStorage.getItem('gamehubWishlist') || '{}');
      if (w[id]) delete w[id];
      else w[id] = { id: id, name: p.name, emoji: p.emoji || '🎮', price: p.price, imageUrl: p.imageUrl || '' };
      localStorage.setItem('gamehubWishlist', JSON.stringify(w));
      refreshWish();
    });
    refreshWish();

    /* === Tabs === */
    const tabs = container.querySelectorAll('.p2-tab');
    tabs.forEach(function(t){
      t.addEventListener('click', function(){
        tabs.forEach(function(x){ x.classList.remove('on'); });
        t.classList.add('on');
        ['overview','features','req','reviews'].forEach(function(k){
          const el = document.getElementById('tab' + k.charAt(0).toUpperCase() + k.slice(1));
          if (el) el.hidden = (k !== t.dataset.t);
        });
        if (t.dataset.t === 'reviews') loadReviews();
      });
    });

    /* === Related products === */
    fetch('/api/products').then(function(r){ return r.json(); }).then(function(d){
      const list = (d.products || []).filter(function(x){ return x.id !== id; }).slice(0, 5);
      const grid = document.getElementById('relatedGrid');
      if (!list.length) { grid.innerHTML = '<p style="color:var(--muted)">Hakuna bidhaa nyingine.</p>'; return; }
      grid.innerHTML = list.map(function(x){
        return '<a class="p2-related-card" href="product.html?id=' + encodeURIComponent(x.id) + '">' +
          '<div class="img" style="background:' + (ZP.art ? ZP.art(x.name) : 'linear-gradient(135deg,#7c3aed,#4c1d95)') + '">' + esc(x.emoji || '🎮') + '</div>' +
          '<b>' + esc(x.name) + '</b>' +
          '<small>' + money(x.price) + '</small>' +
          '<div class="plats">🎮 PC</div>' +
        '</a>';
      }).join('');
    }).catch(function(){});
  }

  /* === Reviews === */
  function loadReviews() {
    const box = document.getElementById('reviewsContent');
    if (!box) return;
    fetch('/api/reviews/' + id).then(function(r){ return r.json(); }).then(function(d){
      const count = d.count || 0;
      const avg = d.average || 0;
      const hist = [5,4,3,2,1].map(function(star){
        const n = (d.reviews || []).filter(function(r){ return r.rating === star; }).length;
        const pct = count ? Math.round((n / count) * 100) : 0;
        return { star: star, pct: pct };
      });
      box.innerHTML = `
        <div class="p2-review-summary">
          <div>
            <div class="p2-score-big">${avg.toFixed(1)}</div>
            <div class="p2-score-stars">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5 - Math.round(avg))}</div>
            <div class="p2-score-sub">Based on ${count} reviews</div>
          </div>
          <div class="p2-hist">
            ${hist.map(function(h){ return '<div class="p2-hist-row"><span>' + h.star + ' ★</span><div class="p2-hist-bar"><span style="width:' + h.pct + '%"></span></div><span>' + h.pct + '%</span></div>'; }).join('')}
          </div>
        </div>
        <div class="p2-review-list">
          ${(d.reviews || []).length
            ? d.reviews.map(function(r){
                return '<div class="p2-review-item">' +
                  '<div class="avatar">' + esc((r.name || 'M').charAt(0).toUpperCase()) + '</div>' +
                  '<div>' +
                    '<div class="meta"><b style="color:#fff">' + esc(r.name) + '</b><span class="stars">' + '★'.repeat(r.rating) + '</span><span>' + new Date(r.date).toLocaleDateString() + '</span></div>' +
                    '<p>' + esc(r.comment || '') + '</p>' +
                  '</div>' +
                '</div>';
              }).join('')
            : '<p style="color:var(--muted)">Hakuna maoni bado. Kuwa wa kwanza kuacha maoni!</p>'}
        </div>
        <div class="p2-review-form">
          <h4>✍️ Acha Maoni Yako</h4>
          <select id="rRating">
            <option value="5">⭐⭐⭐⭐⭐ Nzuri Sana</option>
            <option value="4">⭐⭐⭐⭐ Nzuri</option>
            <option value="3">⭐⭐⭐ Wastani</option>
            <option value="2">⭐⭐ Si Nzuri</option>
            <option value="1">⭐ Mbaya</option>
          </select>
          <input type="text" id="rComment" placeholder="Maoni yako (hiari)">
          <button id="rSubmit">📤 Tuma Maoni</button>
          <p class="p2-msg" id="rMsg"></p>
        </div>
      `;
      document.getElementById('rSubmit').addEventListener('click', function(){
        const token = localStorage.getItem('gamehubToken');
        const msg = document.getElementById('rMsg');
        if (!token) { msg.textContent = '🔐 Ingia kwanza kuacha maoni.'; setTimeout(function(){ location.href = 'login.html'; }, 1200); return; }
        fetch('/api/reviews/' + id, {
          method: 'POST',
          headers: { 'Authorization': token, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            rating: Number(document.getElementById('rRating').value),
            comment: document.getElementById('rComment').value.trim()
          })
        }).then(function(r){ return r.json(); }).then(function(data){
          msg.textContent = data.message || data.error || 'Hitilafu';
          if (data.success) { document.getElementById('rComment').value = ''; loadReviews(); }
        }).catch(function(){ msg.textContent = '❌ Hitilafu ya mtandao.'; });
      });
    }).catch(function(){
      box.innerHTML = '<p style="color:var(--muted)">Imeshindwa kupakia maoni.</p>';
    });
  }

  /* === Load product === */
  fetch('/api/products').then(function(r){ return r.json(); }).then(function(d){
    const list = (d.products || []);
    const p = list.find(function(x){ return String(x.id) === String(id); });
    if (p) { render(p); return; }
    // fallback: default products
    const DEFAULTS = {
      fifa25: { name:'FIFA 25', type:'PC GAMING', price:'45,000 TZS', priceNumber:45000, emoji:'⚽', desc:'Game key halali ya FIFA 25 kwa PC.' },
      gta5: { name:'GTA V', type:'PC GAMING', price:'35,000 TZS', priceNumber:35000, emoji:'🚗', desc:'Game key halali ya GTA V kwa PC.' },
      minecraft: { name:'Minecraft', type:'PC GAMING', price:'30,000 TZS', priceNumber:30000, emoji:'🧱', desc:'Minecraft Java Edition.' }
    };
    const def = DEFAULTS[id];
    if (def) { render(def); return; }
    document.getElementById('productContainer').innerHTML = '<div style="text-align:center;padding:40px"><h2>😕 Bidhaa haipatikani</h2><a class="zp-btn" href="shop.html">← Rudi Dukani</a></div>';
  }).catch(function(){
    document.getElementById('productContainer').innerHTML = '<div style="text-align:center;padding:40px"><h2>❌ Hitilafu ya mtandao</h2><a class="zp-btn" href="shop.html">← Rudi Dukani</a></div>';
  });

})();
</script>

</body>
</html>
