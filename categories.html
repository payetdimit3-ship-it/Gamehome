<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Games — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="grid"></div>
    <div><h1>Games</h1><p>Chagua platform unayotumia — PSP, PS2, PS3, Nintendo Switch, Android au PC.</p></div>
    <div class="zp-ph-side opt"><a class="zp-btn" href="shop.html"><span data-ic="bag"></span>Store Yote</a></div>
  </header>

  <div class="zp-cat-big" id="platGrid"></div>

  <div class="zp-sec"><h2>Bidhaa Mpya</h2><a href="shop.html">Angalia Zote <span data-ic="chevr"></span></a></div>
  <section class="zp-grid c5 hscroll" id="latest"><div class="zp-empty"><p>Inapakia...</p></div></section>

  <section class="zp-ai" style="margin-top:34px">
    <div>
      <h2 style="font-size:26px">Hujui game inayofaa device yako?</h2>
      <p style="margin:0">Tumia AI Recommendations — inakuchagulia game kulingana na simu, PC au console uliyonayo.</p>
    </div>
    <a class="zp-btn" href="recommendations.html"><span data-ic="bot"></span>Uliza AI</a>
  </section>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });
  var SUB={android:'Games na top-up za simu'};
  function tiles(counts){
    document.getElementById('platGrid').innerHTML=ZP.PLATFORMS.map(function(p){
      var n=counts[p.key]||0;
      return '<a class="zp-plat" href="shop.html?cat='+p.key+'" style="--art:'+p.art+'"><span class="zp-pi">'+p.emoji+'</span><h3>'+ZP.esc(p.title)+'</h3><span>'+ZP.esc(SUB[p.key]||p.sub)+'</span><b>'+(n?n+' bidhaa':'Angalia')+'</b></a>';
    }).join('');
  }
  tiles({});
  ZP.loadProducts().then(function(list){
    var c={}; list.forEach(function(p){ if(p.platform) c[p.platform]=(c[p.platform]||0)+1; });
    tiles(c);
    document.getElementById('latest').innerHTML=list.slice(0,10).map(ZP.card).join('');
  });
})();
</script>
</body>
</html>
