<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Orders — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="box"></div>
    <div><h1>My Orders</h1><p>Bidhaa ulizonunua na hali ya malipo yako.</p></div>
    <div class="zp-ph-side opt"><a class="zp-btn ghost" href="mygames.html"><span data-ic="book"></span>My Games</a></div>
  </header>

  <nav class="zp-tabs" id="statusTabs" hidden aria-label="Hali ya oda"></nav>
  <div id="orders" aria-live="polite"><div class="zp-empty"><p>Inapakia...</p></div></div>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  var esc=ZP.esc;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });
  var token=localStorage.getItem('gamehubToken'), box=document.getElementById('orders'), tabsEl=document.getElementById('statusTabs');
  var all=[], filter='all';

  var GROUPS={ successful:'ok', pending_manual:'wait', pending_clickpesa:'wait', failed:'bad', amount_mismatch:'bad' };
  var LABEL={ successful:'Imethibitishwa', pending_manual:'Inasubiri Uthibitisho', pending_clickpesa:'Inasubiri Malipo', failed:'Imeshindwa', amount_mismatch:'Tatizo la Kiasi' };
  var TABS=[['all','Zote'],['ok','Zilizothibitishwa'],['wait','Zinazosubiri'],['bad','Zenye Tatizo']];

  function groupOf(o){ return GROUPS[o.status]||'wait'; }
  function label(o){ return LABEL[o.status]||o.status; }
  function safeUrl(u){ u=String(u||'').trim(); return /^(https?:\/\/|\/)/i.test(u)?u:''; }

  function itemRow(i,o,idx,oi){
    var link=safeUrl(i.downloadLink), showDL=o.status==='successful'&&link, showAcct=o.status==='successful'&&i.accountUser;
    var key='c'+idx+'-'+oi;
    return '<div class="or-item"><div class="n"><b>'+esc(i.emoji||'🎮')+' '+esc(i.name)+'</b> × '+esc(i.qty||1)+
      (showAcct?' <button class="zp-btn ghost sm" type="button" data-cred="'+key+'" style="margin-left:8px">'+ZP.icon('shield')+'Taarifa za account</button><div class="mg-cred" id="cred'+key+'" hidden></div>':'')+'</div>'+
      (showDL?'<a class="zp-btn sm" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">'+ZP.icon('download')+'Download</a>':'<span class="p">'+ZP.money((Number(i.num)||0)*(Number(i.qty)||1))+'</span>')+
      '</div>';
  }
  function card(o,idx){
    var g=groupOf(o), items=(o.items||[]).map(function(i,oi){ return itemRow(i,o,idx,oi); }).join('');
    var note = o.status==='pending_manual' ? 'Admin bado hajathibitisha malipo yako. Ukishalipa, subiri kidogo au wasiliana WhatsApp.'
             : o.status==='pending_clickpesa' ? 'Tunathibitisha malipo yako...'
             : o.status==='amount_mismatch' ? 'Kiasi kilicholipwa hakikamilika sahihi. Wasiliana nasi WhatsApp na tx ref hii.'
             : o.status==='failed' ? 'Malipo hayakufanikiwa. Unaweza kujaribu tena kwenye Store.' : '';
    return '<article class="or-card '+g+'" data-idx="'+idx+'"><div class="or-head"><b>'+esc(o.tx_ref||'—')+'</b><time>'+esc(new Date(o.date).toLocaleString())+'</time>'+
      '<span class="or-pill '+g+'">'+ZP.icon(g==='ok'?'check':g==='bad'?'alert':'wallet')+esc(label(o))+'</span>'+
      '<div class="or-total">Jumla: <strong>'+ZP.money(o.amount)+' TZS</strong></div></div>'+
      '<div class="or-items">'+items+'</div>'+
      (note?'<p class="or-note">💡 '+esc(note)+'</p>':'')+
      '</article>';
  }

  function render(){
    var counts={all:all.length,ok:0,wait:0,bad:0};
    all.forEach(function(o){ counts[groupOf(o)]++; });
    tabsEl.hidden=all.length<2;
    tabsEl.innerHTML=TABS.map(function(t){ return '<button type="button" class="zp-chip'+(t[0]===filter?' active':'')+'" data-f="'+t[0]+'">'+t[1]+' <i>'+counts[t[0]]+'</i></button>'; }).join('');
    var list=all.filter(function(o){ return filter==='all'||groupOf(o)===filter; });
    if (!list.length){ box.innerHTML='<div class="zp-empty"><h3>'+(all.length?'Hakuna oda kwenye kundi hili':'Hujawahi kununua bidhaa yoyote')+'</h3><p>'+(all.length?'Chagua kundi lingine hapo juu.':'Bidhaa ulizonunua zitaonekana hapa.')+'</p><a class="zp-btn" href="shop.html">'+ZP.icon('bag')+'Nenda Dukani</a></div>'; return; }
    box.innerHTML='<div class="or-list">'+list.map(function(o){ return card(o, all.indexOf(o)); }).join('')+'</div>';
  }

  box.addEventListener('click',function(e){
    var b=e.target.closest('[data-cred]'); if(!b) return;
    var idx=b.dataset.cred.split('-')[0].slice(1), oi=b.dataset.cred.split('-')[1], o=all[idx], it=(o.items||[])[oi];
    var panel=document.getElementById('cred'+b.dataset.cred);
    if (!panel.hidden){ panel.hidden=true; return; }
    panel.hidden=false; panel.innerHTML='';
    [['Email/Username',it.accountUser,false],['Password',it.accountPassword||'—',true]].forEach(function(row){
      var d=document.createElement('div'), s=document.createElement('span'), c=document.createElement('code'), cp=document.createElement('button');
      s.textContent=row[0]+':'; c.textContent=row[2]?'••••••••':row[1]; cp.type='button'; cp.textContent='Nakili';
      cp.addEventListener('click',function(){ if(navigator.clipboard) navigator.clipboard.writeText(String(row[1])).then(function(){ cp.textContent='Imenakiliwa'; setTimeout(function(){ cp.textContent='Nakili'; },1500); }); });
      d.appendChild(s); d.appendChild(c);
      if (row[2]){ var sh=document.createElement('button'); sh.type='button'; sh.textContent='Onyesha'; sh.addEventListener('click',function(){ var hid=c.textContent==='••••••••'; c.textContent=hid?row[1]:'••••••••'; sh.textContent=hid?'Ficha':'Onyesha'; }); d.appendChild(sh); }
      d.appendChild(cp); panel.appendChild(d);
    });
  });
  tabsEl.addEventListener('click',function(e){ var b=e.target.closest('[data-f]'); if(b){ filter=b.dataset.f; render(); } });

  function empty(h,p,btn){ box.innerHTML='<div class="zp-empty"><h3>'+h+'</h3><p>'+p+'</p>'+(btn||'')+'</div>'; }
  if (!token){ empty('Ingia kwanza kuona oda zako','Bidhaa ulizonunua na hali ya malipo zinaonekana hapa baada ya kuingia.','<a class="zp-btn" href="login.html?return=myorders.html">'+ZP.icon('user')+'Ingia</a>'); return; }

  function load(){
    fetch('/api/my-orders',{headers:{'Authorization':token}}).then(function(r){ return r.json(); }).then(function(d){
      if (!d.success){ empty('Session imeisha','Ingia tena kuona oda zako.','<a class="zp-btn" href="login.html?return=myorders.html">'+ZP.icon('user')+'Ingia</a>'); return; }
      all=d.orders||[]; render();
      /* self-heal: check pending ClickPesa orders once, silently refresh if any turned successful */
      var pending=all.filter(function(o){ return o.status==='pending_clickpesa'; });
      if (pending.length){
        Promise.all(pending.map(function(o){
          return fetch('/api/clickpesa-check/'+encodeURIComponent(o.tx_ref),{headers:{'Authorization':token}}).then(function(r){ return r.json(); }).then(function(v){ return v.success&&v.status==='successful'; }).catch(function(){ return false; });
        })).then(function(results){ if (results.some(Boolean)) load(); });
      }
    }).catch(function(){ empty('Imeshindikana kupakia oda','Angalia mtandao kisha jaribu tena.','<button class="zp-btn" type="button" onclick="location.reload()">Jaribu tena</button>'); });
  }
  load();
})();
</script>
</body>
</html>
