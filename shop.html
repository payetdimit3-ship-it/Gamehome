<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Store — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" id="phIcon"></div>
    <div><h1 id="phTitle">Store</h1><p id="phSub">Game keys, top-up, gift cards na Steam accounts.</p></div>
    <div class="zp-ph-side opt"><a class="zp-btn ghost" href="requests.html" id="reqTop"></a></div>
  </header>

  <nav class="zp-tabs" id="platTabs" aria-label="Platform"></nav>

  <div class="zp-toolbar">
    <label class="zp-search">
      <span id="srchIc"></span>
      <input type="search" id="searchBox" placeholder="Tafuta game... (mfano: FIFA)" autocomplete="off" aria-label="Tafuta game">
    </label>
    <div class="zp-chips" id="kindChips" role="group" aria-label="Aina ya bidhaa"></div>
    <select id="sortSel" aria-label="Panga" style="height:36px;padding:0 12px;margin-left:auto">
      <option value="new">Mpya kwanza</option>
      <option value="low">Bei: chini → juu</option>
      <option value="high">Bei: juu → chini</option>
      <option value="az">A – Z</option>
    </select>
  </div>

  <p class="zp-count" id="countLine" aria-live="polite"></p>
  <section class="zp-grid" id="productGrid"><div class="zp-empty"><p>Inapakia...</p></div></section>

  <section class="zp-ai" style="margin-top:34px">
    <div>
      <h2 style="font-size:26px">Game Haipo Kwenye Duka?</h2>
      <p style="margin:0">Omba game yako — wateja wengi wakiiomba, tunaiweka haraka.</p>
    </div>
    <a class="zp-btn" href="requests.html" id="reqBottom"></a>
  </section>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  var esc=ZP.esc;
  var params=new URLSearchParams(location.search);
  var plat=params.get('cat')||'', kind=params.get('kind')||'all', q=params.get('search')||'', sort=params.get('sort')||'new';
  if (['key','topup','gift','account'].indexOf(plat)>-1){ kind=plat; plat=''; }   // old links: ?cat=gift
  if (!ZP.platformOf(plat)) plat='';
  if (!ZP.KINDS.some(function(k){return k.key===kind;})) kind='all';

  var pl=ZP.platformOf(plat);
  document.getElementById('phIcon').innerHTML=ZP.icon(pl?pl.icon:'bag');
  document.getElementById('phTitle').textContent=pl?pl.title:'Store';
  document.getElementById('phSub').textContent=pl?pl.sub+' — chagua, lipa, cheza.':'Game keys, top-up, gift cards na Steam accounts.';
  document.title=(pl?pl.title:'Store')+' — LIFEISGAMETZ';
  document.getElementById('srchIc').innerHTML=ZP.icon('search');
  document.getElementById('reqTop').innerHTML=ZP.icon('file')+'Omba Game';
  document.getElementById('reqBottom').innerHTML=ZP.icon('file')+'Omba Game Sasa';
  document.getElementById('searchBox').value=q;
  document.getElementById('sortSel').value=sort;

  document.getElementById('platTabs').innerHTML=
    '<a class="zp-chip'+(plat?'':' active')+'" href="shop.html">Zote</a>'+
    ZP.PLATFORMS.map(function(p){ return '<a class="zp-chip'+(p.key===plat?' active':'')+'" href="shop.html?cat='+p.key+'">'+esc(p.label)+'</a>'; }).join('');

  var all=[], grid=document.getElementById('productGrid'), chipsEl=document.getElementById('kindChips'), countEl=document.getElementById('countLine');

  function scoped(){ return all.filter(function(p){ return !plat || p.platform===plat; }); }
  function renderChips(){
    var base=scoped();
    chipsEl.innerHTML=ZP.KINDS.map(function(k){
      var n=k.key==='all'?base.length:base.filter(function(p){return p.kind===k.key;}).length;
      return '<button type="button" class="zp-chip'+(k.key===kind?' active':'')+'" data-k="'+k.key+'">'+esc(k.label)+' <i>'+n+'</i></button>';
    }).join('');
  }
  function sync(){
    var u=new URLSearchParams();
    if(plat) u.set('cat',plat); if(kind!=='all') u.set('kind',kind); if(q) u.set('search',q); if(sort!=='new') u.set('sort',sort);
    history.replaceState(null,'', 'shop.html'+(u.toString()?'?'+u:''));
  }
  function render(){
    var term=q.trim().toLowerCase();
    var list=scoped().filter(function(p){
      return (kind==='all'||p.kind===kind) && (!term || (p.name+' '+p.type).toLowerCase().indexOf(term)>-1);
    });
    if (sort==='low') list.sort(function(a,b){return a.price-b.price;});
    else if (sort==='high') list.sort(function(a,b){return b.price-a.price;});
    else if (sort==='az') list.sort(function(a,b){return a.name.localeCompare(b.name);});
    renderChips();
    countEl.textContent=list.length+(list.length===1?' bidhaa':' bidhaa');
    if(!list.length){
      grid.innerHTML='<div class="zp-empty"><h3>'+(term?'Hakuna kilichopatikana':(pl?'Bado hakuna bidhaa za '+esc(pl.label):'Hakuna bidhaa'))+'</h3>'+
        '<p>'+(term?'Jaribu neno lingine au ondoa vichujio.':'Omba game unayotaka na tutaiongeza haraka.')+'</p>'+
        '<a class="zp-btn" href="requests.html">Omba Game</a></div>';
      return;
    }
    grid.innerHTML=list.map(ZP.card).join('');
  }

  chipsEl.addEventListener('click',function(e){ var b=e.target.closest('[data-k]'); if(!b) return; kind=b.dataset.k; sync(); render(); });
  document.getElementById('searchBox').addEventListener('input',function(e){ q=e.target.value; sync(); render(); });
  document.getElementById('sortSel').addEventListener('change',function(e){ sort=e.target.value; sync(); render(); });

  ZP.loadProducts().then(function(list){ all=list; render(); });
})();
</script>
</body>
</html>
