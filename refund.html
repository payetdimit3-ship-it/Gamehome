<!DOCTYPE html>
<html lang="sw">

<script src="zoneplay-shell.js"></script>

<script>
(function(){
  var esc=ZP.esc;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });
  var R=[
    ['Bidhaa za Digital (Keys, Accounts, Top-up)','Kwa sababu bidhaa hizi ni za digital na hazirudishwi baada ya kutolewa, hatutoi refund baada ya key au account kutumwa — isipokuwa bidhaa haikufanya kazi kabisa (invalid key, account tayari imebadilishwa password na muuzaji, n.k.).'],

})();
