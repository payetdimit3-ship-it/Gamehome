<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TV Channels — LIFEISGAMETZ</title>
  <meta name="description" content="Tazama channels mbalimbali za TV moja kwa moja.">
  <link rel="stylesheet" href="zoneplay-full.css">
  <style>
    .tv-stage{display:grid;gap:12px;margin-bottom:16px}
    .tv-now{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .tv-now h2{margin:0;font:700 20px var(--font-d)}.tv-now small{color:var(--muted)}
    .tv-ph{display:grid;place-items:center;text-align:center;gap:8px;min-height:220px;color:#c4d0ee;aspect-ratio:16/9;border-radius:14px;border:1px dashed #2a3a7a;background:linear-gradient(135deg,#0e1a3f,#0a1330)}
    .tv-ph b{font:700 18px var(--font-d)}
    .tv-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
    .tv-search{display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;border:1px solid #1d3570;background:#08122c;padding:0 12px;margin:10px 0}
    .tv-search input{flex:1;min-width:0;background:none;border:0;color:#f4f7ff;font:500 14px var(--font-b);outline:0}
    .tv-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    .tv-ch{width:100%;box-sizing:border-box;position:relative;background:linear-gradient(180deg,#0e1a3f,#0a1330);border:1px solid var(--line2);border-radius:14px;padding:14px 10px 12px;display:grid;justify-items:center;gap:8px;text-align:center;cursor:pointer;color:inherit;font:inherit}
    .tv-ch:hover,.tv-ch:focus-visible{border-color:#7c3aff;outline:0}.tv-ch.on{border-color:#19d8ff;box-shadow:0 0 0 2px #19d8ff55}
    .tv-ch.off{opacity:.55}
    .tv-logo{width:72px;height:72px;border-radius:14px;background:#0b1230;display:grid;place-items:center;overflow:hidden;font:700 28px var(--font-d);color:#a78bfa}
    .tv-logo img{width:100%;height:100%;object-fit:contain}
    .tv-ch b{font:700 14px/1.25 var(--font-d)}.tv-ch small{color:var(--muted);font-size:12px}
    .tv-live{position:absolute;left:8px;top:8px;font:700 10px var(--font-b);padding:3px 8px;border-radius:99px;background:#d6204b;color:#fff;letter-spacing:.5px}
    .tv-live.off{background:#3a3f5c;color:#c4d0ee}
    .tv-grid>div{position:relative;min-width:0}.tv-fav{position:absolute;right:6px;top:4px;background:none;border:0;font-size:18px;cursor:pointer;color:#ffd166;line-height:1;padding:4px}
  </style>
</head>
<body>
<div class="main">
  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="tv"></div>
    <div><h1>TV Channels</h1><p>Chagua channel na uangalie moja kwa moja.</p></div>
  </header>

  <section class="tv-stage" aria-label="Player">
    <div id="tvPlayer"><div class="tv-ph"><div><b>📺 Chagua channel</b><br><small>Bonyeza channel yoyote hapa chini kuanza kutazama.</small></div></div></div>
    <div class="tv-now" id="tvNow" hidden><div><h2 id="nowName"></h2><small id="nowMeta"></small></div><div style="display:flex;gap:8px"><button class="zp-btn ghost" id="nowFav" type="button"></button><button class="zp-btn ghost" id="nowShare" type="button">🔗 Share</button></div></div>
  </section>

  <div class="tv-bar" id="tvCats" role="tablist" aria-label="Category"></div>
  <label class="tv-search"><span aria-hidden="true">🔎</span><input type="search" id="tvQ" placeholder="Tafuta channel…" aria-label="Tafuta channel" autocomplete="off"></label>
  <p class="zp-count" id="tvCount" aria-live="polite"></p>
  <section class="tv-grid" id="tvGrid"><div class="zp-empty" style="grid-column:1/-1"><p>Inapakia…</p></div></section>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script src="zp-player.js"></script>
<script>
(function(){
  var esc = ZP.esc;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });
  var all = [], cat = '', q = '', cur = null, player = null, favs = [];
  try { favs = JSON.parse(localStorage.getItem('zpTvFav') || '[]') || []; } catch(e) {}
  var $ = function(id){ return document.getElementById(id); };
  function saveFavs(){ try { localStorage.setItem('zpTvFav', JSON.stringify(favs)); } catch(e) {} }

  function logo(c){ return c.logo ? '<img src="'+esc(c.logo)+'" alt="" loading="lazy" onerror="this.remove()">' : esc((c.name||'?').trim().charAt(0).toUpperCase()); }
  function render(){
    var term = q.trim().toLowerCase();
    var list = all.filter(function(c){ return (cat==='★' ? favs.indexOf(c.id)>-1 : (!cat || c.category===cat)) && (!term || (c.name+' '+(c.description||'')+' '+(c.country||'')).toLowerCase().indexOf(term)>-1); });
    var cats = []; all.forEach(function(c){ if (cats.indexOf(c.category)<0) cats.push(c.category); });
    $('tvCats').innerHTML = '<button type="button" class="zp-chip'+(cat?'':' active')+'" data-cat="">Zote <i>'+all.length+'</i></button>'+
      (favs.length?'<button type="button" class="zp-chip'+(cat==='★'?' active':'')+'" data-cat="★">⭐ Favorites <i>'+favs.length+'</i></button>':'')+
      cats.map(function(k){ return '<button type="button" class="zp-chip'+(cat===k?' active':'')+'" data-cat="'+esc(k)+'">'+esc(k)+' <i>'+all.filter(function(c){return c.category===k;}).length+'</i></button>'; }).join('');
    $('tvCount').textContent = list.length + ' channel' + (list.length===1?'':'s');
    $('tvGrid').innerHTML = list.length ? list.map(function(c){
      var off = c.status==='offline', f = favs.indexOf(c.id)>-1;
      return '<div style="position:relative"><button type="button" class="tv-ch'+(cur&&cur.id===c.id?' on':'')+(off?' off':'')+'" data-id="'+esc(c.id)+'" aria-label="'+esc(c.name)+(off?' (haipo hewani)':'')+'">'+
        '<span class="tv-live'+(off?' off':'')+'">'+(off?'OFFLINE':'● LIVE')+'</span><span class="tv-logo">'+logo(c)+'</span><b>'+esc(c.name)+'</b><small>'+esc(c.category)+(c.country?' • '+esc(c.country):'')+'</small></button>'+
        '<button type="button" class="tv-fav" data-fav="'+esc(c.id)+'" aria-label="'+(f?'Ondoa kwenye favorites':'Weka kwenye favorites')+'">'+(f?'★':'☆')+'</button></div>';
    }).join('') : '<div class="zp-empty" style="grid-column:1/-1"><h3>'+(all.length?'Hakuna channel iliyopatikana':'Bado hakuna channels')+'</h3><p>'+(all.length?'Jaribu neno au category nyingine.':'Channels zitaonekana hapa zikiongezwa na admin.')+'</p></div>';
  }
  function play(c, scroll){
    if (c.status==='offline'){ $('tvPlayer').innerHTML = '<div class="tv-ph"><div><b>⚪ '+esc(c.name)+' haipo hewani</b><br><small>Jaribu channel nyingine au rudi baadaye.</small></div></div>'; cur = c; showNow(c); render(); return; }
    cur = c;
    if (player) player.destroy();
    player = ZP.player.mount($('tvPlayer'), { type:c.type, url:c.streamUrl, embedUrl:c.embedUrl }, { autoplay:true, title:c.name });
    showNow(c); render(); history.replaceState(null,'','#ch='+c.id);
    if (scroll) $('tvPlayer').scrollIntoView({ behavior:'smooth', block:'start' });
  }
  function showNow(c){
    $('tvNow').hidden = false; $('nowName').textContent = c.name;
    $('nowMeta').textContent = c.category + (c.country?' • '+c.country:'') + (c.description?' — '+c.description:'');
    $('nowFav').textContent = favs.indexOf(c.id)>-1 ? '★ Favorite' : '☆ Favorite';
    document.title = c.name + ' — TV | LIFEISGAMETZ';
  }
  $('tvCats').addEventListener('click', function(e){ var b = e.target.closest('[data-cat]'); if (b){ cat = b.dataset.cat; render(); } });
  $('tvGrid').addEventListener('click', function(e){
    var f = e.target.closest('[data-fav]');
    if (f){ var id = f.dataset.fav, i = favs.indexOf(id); if (i>-1) favs.splice(i,1); else favs.push(id); saveFavs(); if (!favs.length && cat==='★') cat=''; render(); if (cur) showNow(cur); return; }
    var b = e.target.closest('.tv-ch'); if (!b) return;
    var c = all.filter(function(x){ return x.id===b.dataset.id; })[0]; if (c) play(c, true);
  });
  $('nowFav').addEventListener('click', function(){ if (!cur) return; var i = favs.indexOf(cur.id); if (i>-1) favs.splice(i,1); else favs.push(cur.id); saveFavs(); showNow(cur); render(); });
  $('nowShare').addEventListener('click', function(){
    if (!cur) return; var url = location.origin + location.pathname + '#ch=' + cur.id;
    if (navigator.share) navigator.share({ title: cur.name, url: url }).catch(function(){});
    else window.open('https://wa.me/?text=' + encodeURIComponent(cur.name + ' — ' + url), '_blank', 'noopener');
  });
  var t = null; $('tvQ').addEventListener('input', function(e){ clearTimeout(t); t = setTimeout(function(){ q = e.target.value; render(); }, 250); });

  fetch('/api/tv/channels').then(function(r){ return r.json(); }).then(function(d){
    all = d.channels || []; render();
    var m = /^#ch=(.+)$/.exec(location.hash);
    if (m){ var c = all.filter(function(x){ return x.id===m[1]; })[0]; if (c) play(c, false); }
  }).catch(function(){ $('tvGrid').innerHTML = '<div class="zp-empty" style="grid-column:1/-1"><h3>Hitilafu ya mtandao</h3><p>Jaribu tena baadaye.</p></div>'; });
})();
</script>
</body>
</html>
