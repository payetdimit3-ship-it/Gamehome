<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gift Cards — LIFEISGAMETZ</title>
  <link rel="stylesheet" href="zoneplay-full.css">
</head>
<body>
<div class="main">

  <header class="zp-page-head">
    <div class="zp-ph-ic" data-ic="gift"></div>
    <div><h1>Gift Cards</h1><p>Steam, PlayStation na zaidi — lipa kwa M-Pesa, Tigo Pesa, Airtel Money au Halotel.</p></div>
    <div class="zp-ph-side opt"><a class="zp-btn ghost" href="requests.html"><span data-ic="file"></span>Omba Gift Card</a></div>
  </header>

  <div class="gc-brands" id="brands" aria-label="Chagua brand"></div>

  <div class="zp-toolbar">
    <label class="zp-search"><span data-ic="search"></span><input type="search" id="q" placeholder="Tafuta gift card..." autocomplete="off" aria-label="Tafuta gift card"></label>
    <select id="sortSel" aria-label="Panga" style="height:36px;padding:0 12px;margin-left:auto">
      <option value="low">Bei: chini → juu</option>
      <option value="high">Bei: juu → chini</option>
      <option value="az">A – Z</option>
    </select>
  </div>

  <p class="zp-count" id="count" aria-live="polite"></p>
  <section class="gc-grid" id="grid"><div class="zp-empty"><p>Inapakia...</p></div></section>

  <section class="zp-ai" style="margin-top:34px">
    <div>
      <h2 style="font-size:26px">Gift Card unayotaka haipo?</h2>
      <p style="margin:0">Tuambie brand na kiasi unachohitaji, tutakiweka haraka.</p>
    </div>
    <a class="zp-btn" href="requests.html"><span data-ic="file"></span>Omba Sasa</a>
  </section>
</div>

<script src="zoneplay-shell.js"></script>
<script src="zp-catalog.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  var esc=ZP.esc;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.insertAdjacentHTML('afterbegin', ZP.icon(el.dataset.ic)); });

  /* Brands are shown as coloured wordmark tiles (no logos). */
  var BRANDS=[
    {key:'steam',label:'Steam',art:'linear-gradient(140deg,#1b2838,#1a6b9a)',re:/steam/i},
    {key:'playstation',label:'PlayStation',art:'linear-gradient(140deg,#0b3d91,#1a1a6e)',re:/psn|playstation|ps ?plus|ps ?store/i},
    {key:'xbox',label:'Xbox',art:'linear-gradient(140deg,#107c10,#0a3d0a)',re:/xbox/i},
    {key:'nintendo',label:'Nintendo',art:'linear-gradient(140deg,#e60012,#7f1d1d)',re:/nintendo|eshop/i},
    {key:'google',label:'Google Play',art:'linear-gradient(140deg,#01875f,#0b3d5a)',re:/google ?play/i},
    {key:'apple',label:'Apple',art:'linear-gradient(140deg,#5a6072,#1c1f2b)',re:/apple|itunes/i},
    {key:'roblox',label:'Roblox',art:'linear-gradient(140deg,#e2231a,#4a0d0d)',re:/roblox|robux/i}
  ];
  var OTHER={key:'other',label:'Nyingine',art:'linear-gradient(140deg,#6a2cff,#1a3fd0)'};
  function brandOf(p){ var t=p.name+' '+p.type; for(var i=0;i<BRANDS.length;i++) if(BRANDS[i].re.test(t)) return BRANDS[i]; return OTHER; }
  function valueOf(p){
    var t=p.name+' '+p.type, m=t.match(/\$\s?(\d+(?:\.\d+)?)/)||t.match(/(\d+(?:\.\d+)?)\s?(?:USD|dollar)/i);
    return m ? '$'+m[1] : ZP.money(p.price)+' TZS';
  }

  var params=new URLSearchParams(location.search);
  var brand=params.get('brand')||'', q=params.get('search')||'', sort=params.get('sort')||'low', all=[];
  document.getElementById('q').value=q; document.getElementById('sortSel').value=sort;

  function sync(){ var u=new URLSearchParams(); if(brand) u.set('brand',brand); if(q) u.set('search',q); if(sort!=='low') u.set('sort',sort); history.replaceState(null,'','giftcards.html'+(u.toString()?'?'+u:'')); }

  function renderBrands(){
    var counts={}; all.forEach(function(p){ var k=brandOf(p).key; counts[k]=(counts[k]||0)+1; });
    var list=BRANDS.concat([OTHER]).filter(function(b){ return counts[b.key]; });
    if (brand && !counts[brand]) brand='';
    document.getElementById('brands').innerHTML = list.length>1 ? '<button type="button" class="gc-brand-tile'+(brand?'':' on')+'" data-b="" style="--art:linear-gradient(140deg,#3a1a99,#0f2a7a)">'+ZP.icon('gift')+'<b>Zote</b><small>'+all.length+' gift cards</small></button>'+
      list.map(function(b){ return '<button type="button" class="gc-brand-tile'+(b.key===brand?' on':'')+'" data-b="'+b.key+'" style="--art:'+b.art+'">'+ZP.icon('gift')+'<b>'+esc(b.label)+'</b><small>'+counts[b.key]+(counts[b.key]===1?' card':' cards')+'</small></button>'; }).join('') : '';
  }

  function card(p){
    var b=brandOf(p), href=ZP.href(p);
    var face = p.imageUrl ? '<img src="'+esc(p.imageUrl)+'" alt="" loading="lazy" onerror="this.remove()">' : '';
    return '<article class="gc-card"><a class="gc-face" href="'+href+'" style="--art:'+b.art+'" aria-label="'+esc(p.name)+'">'+face+
      '<span class="gc-emoji" aria-hidden="true">'+esc(p.emoji||'🎁')+'</span><span class="gc-name">'+esc(b.key==='other'?'GIFT CARD':b.label.toUpperCase())+'</span><span class="gc-val">'+esc(valueOf(p))+'</span></a>'+
      '<div class="gc-info"><h3>'+esc(p.name)+'</h3><small>'+esc(p.desc||p.type)+'</small>'+
      '<div class="zp-buyrow"><span class="zp-price">'+ZP.money(p.price)+'<small>TZS</small></span><a class="zp-btn" href="'+href+'">Nunua</a></div></div></article>';
  }

  function render(){
    renderBrands();
    var term=q.trim().toLowerCase();
    var list=all.filter(function(p){ return (!brand||brandOf(p).key===brand) && (!term||(p.name+' '+p.type).toLowerCase().indexOf(term)>-1); });
    if(sort==='high') list.sort(function(a,b){return b.price-a.price;}); else if(sort==='az') list.sort(function(a,b){return a.name.localeCompare(b.name);}); else list.sort(function(a,b){return a.price-b.price;});
    document.getElementById('count').textContent=list.length+' gift cards';
    document.getElementById('grid').innerHTML = list.length ? list.map(card).join('') :
      '<div class="zp-empty"><h3>'+(all.length?'Hakuna kilichopatikana':'Hakuna Gift Card bado')+'</h3><p>'+(all.length?'Jaribu brand nyingine au ondoa neno la kutafuta.':'Admin akiongeza gift cards kwenye duka zitaonekana hapa.')+'</p><a class="zp-btn" href="requests.html">Omba Gift Card</a></div>';
  }

  document.getElementById('brands').addEventListener('click',function(e){ var b=e.target.closest('[data-b]'); if(!b) return; brand=b.dataset.b; sync(); render(); });
  document.getElementById('q').addEventListener('input',function(e){ q=e.target.value; sync(); render(); });
  document.getElementById('sortSel').addEventListener('change',function(e){ sort=e.target.value; sync(); render(); });

  ZP.loadProducts().then(function(list){ all=list.filter(function(p){ return p.kind==='gift'; }); render(); });
})();
</script>
</body>
</html>
